<!-- shared/head.html : injected into EVERY page's <head> at build time.
     {{key}} = value from site.json, {{#key}}...{{/key}} = only when the value is set.
     Change favicon, AdSense, analytics here once and every app updates on the next deploy. -->
{{#icon}}<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='17' fill='%2314121B'/%3E%3Cpath d='M16.5 13.5l11 6.5-11 6.5z' fill='%2300E0A4' stroke='%2300E0A4' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E">{{/icon}}
<meta name="theme-color" content="{{themeColor}}">
{{#adsenseClient}}<meta name="google-adsense-account" content="{{adsenseClient}}">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client={{adsenseClient}}" crossorigin="anonymous"></script>{{/adsenseClient}}
{{#gaId}}<script async src="https://www.googletagmanager.com/gtag/js?id={{gaId}}"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','{{gaId}}')</script>{{/gaId}}
