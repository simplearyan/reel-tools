<style>
/* Layout: a two-column workbench. Preview stage on the left in a framed canvas, properties panel on the right.
   Below 900px the stage sticks to the top and the panel scrolls underneath. */
:root{
  --f:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --m:'DM Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --bg:#ECE7DD; --panel:#F7F4ED; --fg:#14110D; --mut:#675F52; --line:rgba(20,17,13,.13);
  --acc:#00E0A4; --acc-ink:#05261D; --chip:rgba(20,17,13,.07); --stage:#E2DCCF;
  --frame-a:linear-gradient(150deg,#FBF8F1,#E8E0D1); --ctl:#FFFFFF; --err:#B3261E;
  --shadow:0 1px 2px rgba(20,17,13,.08),0 14px 34px rgba(20,17,13,.09);
  --chk1:#d9d4c8; --chk2:#ece8de; --trk:rgba(20,17,13,.13);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C0B09; --panel:#16130F; --fg:#F3EEE4; --mut:#A29A8B; --line:rgba(243,238,228,.13);
    --chip:rgba(243,238,228,.08); --stage:#100E0B; --frame-a:linear-gradient(150deg,#26211A,#0E0C09);
    --ctl:#221E18; --err:#FF8A80; --shadow:0 1px 2px rgba(0,0,0,.5),0 14px 34px rgba(0,0,0,.45);
    --chk1:#26221c; --chk2:#1a1713; --trk:rgba(243,238,228,.18); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C0B09; --panel:#16130F; --fg:#F3EEE4; --mut:#A29A8B; --line:rgba(243,238,228,.13);
  --chip:rgba(243,238,228,.08); --stage:#100E0B; --frame-a:linear-gradient(150deg,#26211A,#0E0C09);
  --ctl:#221E18; --err:#FF8A80; --shadow:0 1px 2px rgba(0,0,0,.5),0 14px 34px rgba(0,0,0,.45);
  --chk1:#26221c; --chk2:#1a1713; --trk:rgba(243,238,228,.18); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 14px/1.45 var(--f);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.mono{font-family:var(--m);font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:minmax(0,1fr) 340px 74px;grid-template-rows:auto minmax(0,1fr);gap:12px 16px;height:100%;padding-block:12px}
.top{grid-column:1/-1;display:flex;align-items:center;gap:16px;min-width:0}
.brand{display:flex;align-items:center;gap:10px;font-size:18px;letter-spacing:-.04em;white-space:nowrap}
.brand b{font-weight:800}.brand i{font-style:normal;font-weight:300}
.brand svg{width:28px;height:28px;flex:none}
.tabs{display:flex;gap:2px;padding:3px;border-radius:99px;background:var(--chip);overflow-x:auto;scrollbar-width:none;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:7px;height:34px;padding:0 14px;border:0;border-radius:99px;background:transparent;color:var(--mut);font-weight:600;white-space:nowrap}
.tab svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.tab:not([aria-selected="true"]):hover{color:var(--fg)}
.tools{margin-left:auto;display:flex;gap:8px;align-items:center}
.icon{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;background:transparent}
.icon:hover{background:var(--chip)}
.icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pill{height:36px;padding:0 16px;border:0;border-radius:99px;background:var(--acc);color:var(--acc-ink);font-weight:700;display:none}

.stage{grid-column:1;grid-row:2;min-width:0;min-height:0;display:flex}
.panel{grid-column:2;grid-row:2}
.rail{grid-column:3;grid-row:2;align-self:start;display:flex;flex-direction:column;gap:4px;padding:6px;border-radius:20px;background:var(--panel);border:1px solid var(--line)}
.rb{width:100%;display:grid;justify-items:center;gap:5px;padding:11px 0 9px;border:0;border-radius:14px;background:transparent;color:var(--mut);font-size:10.5px;font-weight:600;letter-spacing:.01em}
.rb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rb[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.rb:not([aria-selected="true"]):hover{background:var(--chip);color:var(--fg)}
.guides{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.guides *{vector-effect:non-scaling-stroke;stroke:var(--acc);fill:none;stroke-width:1;opacity:.8}
.pair{display:flex;align-items:center;gap:8px;color:var(--mut)}
.pair input{width:100%;min-width:0;font-family:var(--m);font-variant-numeric:tabular-nums}
.viewport{position:relative;flex:1;min-width:0;min-height:0;border-radius:24px;background:var(--stage);border:1px solid var(--line);overflow:hidden;display:grid;place-items:center}
.frame{position:relative;border-radius:12px;overflow:hidden;box-shadow:var(--shadow);background:var(--frame-a)}
.frame.bg-checker{background:conic-gradient(var(--chk1) 25%,var(--chk2) 0 50%,var(--chk1) 0 75%,var(--chk2) 0) 0 0/20px 20px}
.frame.bg-dark{background:#0E0C09}.frame.bg-light{background:#F4F0E6}
#gl{display:block;touch-action:none;cursor:grab}
#gl:active{cursor:grabbing}
.chip{position:absolute;left:14px;top:14px;max-width:calc(100% - 28px);padding:6px 11px;border-radius:99px;background:var(--panel);border:1px solid var(--line);font-size:12px;color:var(--mut);box-shadow:var(--shadow)}
.chip.err{color:var(--err)}
.bar{position:absolute;left:14px;right:14px;bottom:12px;height:44px;display:flex;align-items:center;gap:12px;padding:0 8px;border-radius:99px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow)}
.bar .icon{width:30px;height:30px;border:0;background:var(--fg);color:var(--bg);flex:none}
.bar .icon:hover{background:var(--fg);opacity:.85}
.bar input{flex:1;min-width:0}
.bar .mono{font-size:11.5px;color:var(--mut);white-space:nowrap}
.hint{position:absolute;right:16px;top:14px;margin:0;font-size:11.5px;color:var(--mut)}

.panel{min-height:0;min-width:0;display:flex;flex-direction:column;border-radius:24px;background:var(--panel);border:1px solid var(--line);overflow:hidden}
.ph{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px}
.ph h2{margin:0;font-size:16px;letter-spacing:-.02em}
.ph p{margin:2px 0 0;font-size:12px;color:var(--mut)}
.ghost{border:0;background:transparent;color:var(--mut);font-weight:600;font-size:12.5px;padding:6px 8px;border-radius:8px}
.ghost:hover{color:var(--fg);background:var(--chip)}
.controls{flex:1;min-height:0;overflow:auto;padding:0 18px 12px;scrollbar-width:thin}
details.sec{border-top:1px solid var(--line)}
details.sec>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;padding:13px 0;font-weight:700;font-size:13px;cursor:pointer;user-select:none}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"";width:7px;height:7px;border-right:1.6px solid var(--mut);border-bottom:1.6px solid var(--mut);transform:rotate(45deg) translateY(-2px);transition:transform .15s}
details.sec[open]>summary::after{transform:rotate(-135deg) translate(-2px,0)}
.sec-body{display:grid;gap:13px;padding:0 0 16px}
.row{display:grid;gap:6px;min-width:0}
.row[hidden]{display:none}
.lab{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mut)}
.lab .mono{color:var(--fg)}
input.rng{-webkit-appearance:none;appearance:none;width:100%;height:22px;margin:0;background:transparent;cursor:pointer;--p:0%}
input.rng::-webkit-slider-runnable-track{height:4px;border-radius:99px;background:linear-gradient(to right,var(--fg) var(--p),var(--trk) var(--p))}
input.rng::-webkit-slider-thumb{-webkit-appearance:none;box-sizing:border-box;width:16px;height:16px;margin-top:-6px;border-radius:50%;background:var(--panel);border:2px solid var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .12s}
input.rng:hover::-webkit-slider-thumb{transform:scale(1.12)}
input.rng:active::-webkit-slider-thumb{transform:scale(1.22)}
input.rng::-moz-range-track{height:4px;border-radius:99px;background:var(--trk)}
input.rng::-moz-range-progress{height:4px;border-radius:99px;background:var(--fg)}
input.rng::-moz-range-thumb{box-sizing:border-box;width:16px;height:16px;border-radius:50%;background:var(--panel);border:2px solid var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.25)}
input.rng:focus{outline:none}
input.rng:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px var(--acc)}
input.rng:focus-visible::-moz-range-thumb{box-shadow:0 0 0 3px var(--acc)}
.fld,.row select,.row textarea{width:100%;min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--ctl);padding:8px 10px;outline:none}
.row textarea{resize:vertical;font-family:var(--m);font-size:13px;line-height:1.4}
.fld:focus,.row select:focus,.row textarea:focus{border-color:var(--fg)}
.seg{display:flex;gap:2px;padding:3px;border-radius:10px;background:var(--chip)}
.seg button{flex:1;min-width:0;height:30px;border:0;border-radius:8px;background:transparent;color:var(--mut);font-weight:600;font-size:12.5px}
.seg button[aria-pressed="true"]{background:var(--ctl);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.colors{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}
input[type=color]{-webkit-appearance:none;appearance:none;width:30px;height:26px;padding:0;border:1px solid var(--line);border-radius:8px;background:var(--ctl);cursor:pointer}
input[type=color]::-webkit-color-swatch-wrapper{padding:3px}
input[type=color]::-webkit-color-swatch{border:0;border-radius:5px}
input[type=color]::-moz-color-swatch{border:0;border-radius:5px}
.colors input[type=color]{width:26px;height:26px;border-radius:50%}
.colors input[type=color]::-webkit-color-swatch{border-radius:50%}
.tog{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--mut)}
.tog input{-webkit-appearance:none;appearance:none;width:34px;height:20px;margin:0;border-radius:99px;background:var(--trk);position:relative;cursor:pointer;transition:background .15s;flex:none}
.tog input::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.35);transition:transform .15s}
.tog input:checked{background:var(--fg)}
.tog input:checked::after{transform:translateX(14px)}
.err-t{font-size:12px;color:var(--err);margin:0}
.note{font-size:12px;color:var(--mut);margin:0}

.export{border-top:1px solid var(--line);padding:14px 18px 16px;display:grid;gap:10px;background:var(--panel)}
.export .line{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--mut)}
.export select{border:1px solid var(--line);border-radius:10px;background:var(--ctl);padding:6px 8px}
.btn{height:42px;border:0;border-radius:12px;background:var(--acc);color:var(--acc-ink);font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{filter:brightness(1.05)}
.btn[disabled]{opacity:.6;cursor:progress}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btn2{height:36px;border:1px solid var(--line);border-radius:10px;background:transparent;font-weight:600;font-size:12.5px}
.btn2:hover{background:var(--chip)}
.xs{min-height:16px;margin:0;font-size:12px;color:var(--mut)}

@media (max-width:900px){
  html,body{height:auto}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
  .app{display:block;height:auto;padding-block:10px 24px}
  .rail{flex-direction:row;margin-bottom:10px}
  .rb{grid-auto-flow:column;justify-content:center;align-items:center;gap:8px;padding:11px 0;font-size:12.5px;flex:1}
  .top{flex-wrap:wrap;gap:10px 12px;padding-bottom:10px}
  .tabs{order:3;flex-basis:100%}
  .pill{display:block}
  .stage{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:min(56svh,520px);padding-bottom:10px;background:var(--bg)}
  .panel{border-radius:20px;overflow:visible}
  .controls{overflow:visible}
  .hint{display:none}
}
@media (max-width:420px){.brand i{display:none}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

        case 6:link(T(),B());break;
        case 7:link(T(),L());break;
        case 8:link(T(),L());break;
        case 9:link(T(),B());break;
        case 10:{const cen=(f[y*W+x]+f[y*W+x+1]+f[(y+1)*W+x+1]+f[(y+1)*W+x])/4;

function dp(pts,eps){

    }
    if(md>eps&&mi>0){keep[mi]=1;st.push([a,mi],[mi,b])}

}
function simplifyClosed(pts,eps){

}
const area=p=>{let a=0;for(let i=0,n=p.length;i<n;i++){const q=p[(i+1)%n];a+=p[i][0]*q[1]-q[0]*p[i][1]}return Math.abs(a)/2};

    const xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];

/* canvas -> {outers:[{pts,holes:[pts]}]} in em units, y up, centered */
function traceCanvas(canvas,em,eps){
  const W=canvas.width,H=canvas.height;
  const d=canvas.getContext('2d',{willReadFrequently:true}).getImageData(0,0,W,H).data;
  const f=new Float32Array(W*H);
  for(let i=0;i<f.length;i++)f[i]=d[i*4+3]/255;
  let loops=marching(f,W,H).map(p=>simplifyClosed(p,eps)).filter(p=>p.length>=3);
  loops=loops.map(p=>({pts:p,a:area(p)})).filter(l=>l.a>6).sort((a,b)=>b.a-a.a);
  loops.forEach((l,i)=>{
    l.cont=[];
    for(let j=0;j<i;j++)if(inside(l.pts[0],loops[j].pts))l.cont.push(j);
    l.depth=l.cont.length;
  });

  loops.forEach((l,i)=>{if(l.depth%2===0){const o={pts:l.pts,holes:[]};outers.push(o);map.set(i,o)}});
  loops.forEach((l,i)=>{
    if(l.depth%2===1){

      if(parent>=0&&map.has(parent))map.get(parent).holes.push(l.pts);

}
function dedupe(p){

async function rasterText(text,fontKey){
  const [fam,wt]=FONTS[fontKey];
  const em0=240;
  try{await document.fonts.load(`${wt} ${em0}px "${fam}"`,text)}catch(e){}
  const lines=text.split('\n');
  const probe=document.createElement('canvas').getContext('2d');
  const stack=`"${fam}", "Hanken Grotesk", system-ui, sans-serif`;
  probe.font=`${wt} ${em0}px ${stack}`;
  const maxW=Math.max(...lines.map(l=>probe.measureText(l||' ').width),10);
  const k=Math.min(1,3600/maxW,2600/(em0*1.2*lines.length));
  const em=em0*k,lh=em*1.2,pad=em*.3;
  const c=document.createElement('canvas');
  c.width=Math.ceil(maxW*k+pad*2);c.height=Math.ceil(lh*lines.length+pad*2);
  const ctx=c.getContext('2d');
  ctx.font=`${wt} ${em}px ${stack}`;ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.fillStyle='#000';
  lines.forEach((l,i)=>ctx.fillText(l,c.width/2,pad+lh*i+em*.88));
  return {canvas:c,em};
}
const glyphCache=new Map();
async function glyphsForText(text,fontKey){
  const key='t|'+fontKey+'|'+text;
  if(glyphCache.has(key))return glyphCache.get(key);
  if(!text.trim())throw new Error('Type some text to begin.');
  const {canvas,em}=await rasterText(text,fontKey);
  const g=traceCanvas(canvas,em,Math.max(.6,em/260));
  glyphCache.set(key,g);return g;
}
async function mathReady(){
  for(let i=0;i<100;i++){
    if(window.MathJax&&window.MathJax.startup&&window.MathJax.startup.promise){await window.MathJax.startup.promise;if(window.MathJax.tex2svg)return}
    await new Promise(r=>setTimeout(r,100));
  }
  throw new Error('The math engine did not load. Check your connection and reload.');
}
async function glyphsForMath(tex){
  const key='m|'+tex;
  if(glyphCache.has(key))return glyphCache.get(key);
  if(!tex.trim())throw new Error('Type a LaTeX formula to begin.');
  await mathReady();
  const node=window.MathJax.tex2svg(tex,{display:false});
  const svg=node.querySelector('svg');
  if(!svg)throw new Error('The formula could not be drawn.');
  const bad=svg.querySelector('[data-mml-node="merror"]');
  if(bad)throw new Error(bad.getAttribute('title')||'This formula has a syntax error.');
  const vb=svg.getAttribute('viewBox').split(/\s+/).map(Number);
  const em=240,unit=em/1000;
  let w=vb[2]*unit,h=vb[3]*unit;
  const k=Math.min(1,3600/w,2400/h);
  w*=k;h*=k;
  const pad=em*.25*k,eff=em*k;
  svg.setAttribute('width',w);svg.setAttribute('height',h);svg.removeAttribute('style');
  svg.setAttribute('xmlns','http://www.w3.org/2000/svg');
  let str=new XMLSerializer().serializeToString(svg).replace(/currentColor/g,'#000000');
  const img=new Image();
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(str);
  await img.decode();
  const c=document.createElement('canvas');
  c.width=Math.ceil(w+pad*2);c.height=Math.ceil(h+pad*2);
  c.getContext('2d').drawImage(img,pad,pad,w,h);
  const g=traceCanvas(c,eff,Math.max(.6,eff/260));
  glyphCache.set(key,g);return g;
}

 vec4 mv=modelViewMatrix*vec4(pos,1.0);vV=-mv.xyz;gl_Position=projectionMatrix*mv;}`,
    fragmentShader:`${noiseGLSL()}
uniform float uT,uScale,uFlow,uGlow,uWire;uniform vec3 uA,uB,uC;varying vec3 vN,vP,vV;
void main(){vec3 off=vec3(cos(uT+1.7),sin(uT+1.7),sin(uT))*uFlow;
 float d=fbm(vP*uScale*1.4+off);
 vec3 col=mix(uA,uB,smoothstep(.25,.7,d));col=mix(col,uC,smoothstep(.62,.92,d));
 float fr=pow(1.0-abs(dot(normalize(vN),normalize(vV))),2.4);col+=uC*fr*uGlow;
 if(uWire>.5)col=mix(col,uC,.35)+vec3(.05);
 gl_FragColor=vec4(col,1.0);
 #include <colorspace_fragment>
}`});
}
function buildOrb(){
  const obj=new THREE.Group(),mats=[];let uniforms=[];
  const style=S.orbStyle;
  let body;
  if(style==='plasma'){const m=plasmaMaterial(S.nscale,false);uniforms.push(m.uniforms);body=new THREE.Mesh(new THREE.SphereGeometry(1,96,96),m)}
  else if(style==='wire'){const m=plasmaMaterial(S.nscale,true);uniforms.push(m.uniforms);body=new THREE.Mesh(new THREE.IcosahedronGeometry(1,5),m)}
  else if(style==='chrome'){body=new THREE.Mesh(new THREE.SphereGeometry(1,96,96),new THREE.MeshPhysicalMaterial({color:S.color,metalness:1,roughness:.05,envMapIntensity:1.5,clearcoat:1}))}
  else{
    body=new THREE.Group();
    const shell=new THREE.Mesh(new THREE.SphereGeometry(1,96,96),new THREE.MeshPhysicalMaterial({color:S.oA,metalness:0,roughness:.02,transparent:true,opacity:.2,clearcoat:1,clearcoatRoughness:.02,envMapIntensity:1.8,ior:1.5,side:THREE.DoubleSide,depthWrite:false}));
    shell.renderOrder=2;
    const cm=plasmaMaterial(S.nscale*1.4,false,{uA:{value:new THREE.Color(S.oC).multiplyScalar(.35)},uB:{value:new THREE.Color(S.oC)},uC:{value:new THREE.Color(0xffffff)}});
    cm.uniforms.uAmp.value=.12;cm.uniforms.uGlow.value=1.2;uniforms.push(cm.uniforms);
    const core=new THREE.Mesh(new THREE.SphereGeometry(.5,64,64),cm);core.userData.core=true;
    body.add(core,shell);
  }
  obj.add(body);
  const rings=[];
  if(S.rings){
    [[1.55,.012,.5,0],[1.8,.01,-.8,.6],[2.05,.008,1.1,-.5]].forEach(([R,t,rx,rz],i)=>{
      const ring=new THREE.Mesh(new THREE.TorusGeometry(R,t,10,160),new THREE.MeshBasicMaterial({color:i===1?S.oC:S.oB,transparent:true,opacity:.85,toneMapped:false}));
      ring.rotation.set(rx,0,rz);ring.userData.k=i+1;ring.userData.rx=rx;ring.userData.rz=rz;obj.add(ring);rings.push(ring);
    });
  }
  const tick=ph=>{
    const t=TAU*ph*Math.round(S.oflow);
    uniforms.forEach(u=>{u.uT.value=t});
    const pulse=1+Math.sin(TAU*ph)*S.pulse;body.scale.setScalar(pulse);
    rings.forEach(r=>{r.rotation.set(r.userData.rx,TAU*ph*r.userData.k*(r.userData.k%2?1:-1),r.userData.rz)});
  };
  const fs=S.rings?2.5:1.6;
  return {obj,fit:'sphere',fitSize:new THREE.Vector3(fs,fs,fs),tick};
}
const BUILDERS={text:buildText,math:buildMath,clear:buildClear,saber:async()=>buildSaber(),orb:async()=>buildOrb()};

/* rebuild */
let tok=0,timer=null;
function disposeObj(o){
  o.traverse(c=>{
    if(c.geometry)c.geometry.dispose();
    if(c.material){(Array.isArray(c.material)?c.material:[c.material]).forEach(m=>m.dispose())}
  });
}
function scheduleRebuild(){clearTimeout(timer);timer=setTimeout(()=>rebuild(false),110)}
async function rebuild(immediate){
  if(!THREE)return;
  const my=++tok;
  setStatus(S.mode==='math'?'Typesetting…':'Building…');
  try{
    const res=await BUILDERS[S.mode]();
    if(my!==tok){disposeObj(res.obj);return}
    if(content){anim.remove(content);disposeObj(content)}
    const box=new THREE.Box3().setFromObject(res.obj);
    const size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());
    const holder=new THREE.Group();holder.add(res.obj);
    if(!res.noCenter)res.obj.position.sub(center);
    anim.add(holder);content=holder;
    tickFn=res.tick;fitInfo={mode:res.fit,size:res.fitSize||size};
    fit();setStatus('');
    const e=$('mathErr');if(e)e.hidden=true;
  }catch(e){
    if(my===tok){console.error(e);setStatus(e.message||'Something went wrong.',true)}
  }
}

/* animation + interaction */
function applyLive(k){
  if(k==='aspect'||k==='bg'||k==='bgColor'||k==='cw'||k==='ch'){layout()}
  else if(k==='guides')paintGuides();
  else if(k==='zoom'||k==='fov'||k==='offX'||k==='offY')fit();
}
let last=performance.now(),recStart=0;
function frameLoop(now){
  requestAnimationFrame(frameLoop);
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(!THREE||!renderer)return;
  if(exporting)phase=clamp((now-recStart)/(S.loop*1000),0,1)%1;
  else if(playing)phase=(phase+dt/S.loop)%1;
  anim.rotation.y=TAU*S.spin*phase;
  anim.rotation.x=Math.sin(TAU*phase)*THREE.MathUtils.degToRad(S.sway);
  if(tickFn)tickFn(phase);
  renderer.render(scene,camera);
  if(!exporting){$('scrub').value=Math.round(phase*1000);updateTime()}
}
function updateTime(){$('time').textContent=(phase*S.loop).toFixed(2)+' / '+S.loop.toFixed(1)+' s'}
const PLAY='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor" stroke="none"/></svg>';
const PAUSE='<svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" stroke-width="3"/></svg>';
function paintPlay(){$('playBtn').innerHTML=playing?PAUSE:PLAY;$('playBtn').setAttribute('aria-label',playing?'Pause':'Play')}
$('playBtn').addEventListener('click',()=>{playing=!playing;paintPlay()});
$('scrub').addEventListener('input',e=>{playing=false;paintPlay();phase=(+e.target.value)/1000;updateTime()});
paintPlay();

let drag=null;
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{
  if(!drag||!root)return;
  root.rotation.y+=(e.clientX-drag.x)*.01;root.rotation.x=clamp(root.rotation.x+(e.clientY-drag.y)*.01,-1.4,1.4);
  drag={x:e.clientX,y:e.clientY};
});
canvas.addEventListener('pointerup',()=>{drag=null});
canvas.addEventListener('pointercancel',()=>{drag=null});
canvas.addEventListener('dblclick',()=>{if(root){root.rotation.set(0,0,0)}S.zoom=1;const z=$('c-zoom');if(z){z.value=1;rngPaint(z);const v=z.parentElement.querySelector('.mono');if(v)v.textContent='1.00'}fit()});
canvas.addEventListener('wheel',e=>{
  e.preventDefault();S.zoom=clamp(S.zoom*(e.deltaY>0?.95:1.05),.5,2);
  const z=$('c-zoom');if(z){z.value=S.zoom;rngPaint(z);const v=z.parentElement.querySelector('.mono');if(v)v.textContent=S.zoom.toFixed(2)}fit();
},{passive:false});

/* ------------------------------------------------------------------ export */
const ex=$('expStatus');
function note(t){ex.textContent=t}
async function saveFile(name,data){
  let dl=null;
  try{dl=await (window.claude&&window.claude.use?window.claude.use('downloads'):null)}catch(e){}
  if(dl){
    try{const r=await dl.save({filename:name,data});note(r&&r.status==='saved'?'Saved '+name:'Sent '+name);return}
    catch(e){if(e&&e.code==='declined'){note('Save cancelled.');return}
      if(e&&e.code==='rejected_extension'){note('This file type cannot be saved here.');return}}
  }
  try{
    const blob=data instanceof Blob?data:new Blob([data]);
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);note('Downloaded '+name);
  }catch(e){note('Could not save the file in this view.')}
}
function exportSize(){
  const L=+$('resSel').value,asp=aspectVal();
  let w,h;if(asp>=1){w=L;h=Math.round(L/asp)}else{h=L;w=Math.round(L*asp)}
  return [w&~1,h&~1];
}
function exportClear(){
  if(S.exportBg==='alpha'||S.bg==='checker')return [0x000000,0];
  const cs=getComputedStyle(frame).backgroundColor;
  if(S.bg==='custom')return [new THREE.Color(S.bgColor),1];
  if(S.bg==='dark')return [new THREE.Color('#0E0C09'),1];
  if(S.bg==='light')return [new THREE.Color('#F4F0E6'),1];
  return [new THREE.Color(isDark()?'#17130F':'#F1ECE0'),1];
}
function beginExport(w,h){
  exporting=true;
  const [c,a]=exportClear();renderer.setClearColor(c,a);
  renderer.setPixelRatio(1);renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();fit();
}
function endExport(){
  exporting=false;renderer.setClearColor(0x000000,0);layout();
}
$('expWebm').addEventListener('click',async()=>{
  if(!renderer||exporting)return;
  if(typeof MediaRecorder==='undefined'){note('This browser cannot record video. Try PNG or glTF.');return}
  const btn=$('expWebm'),[w,h]=exportSize();
  btn.disabled=true;btn.textContent='Recording '+w+'×'+h+'…';note('Recording one '+S.loop+' s loop.');
  beginExport(w,h);
  await new Promise(r=>setTimeout(r,120));
  const fps=+$('fpsSel').value||30;const stream=canvas.captureStream(fps);
  const types=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
  const mime=types.find(t=>MediaRecorder.isTypeSupported(t))||'';
  const rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:Math.round(w*h*6*fps/30)}:undefined);
  const chunks=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  rec.onstop=async()=>{
    endExport();btn.disabled=false;btn.textContent='Export WebM loop';
    const blob=new Blob(chunks,{type:'video/webm'});
    if(!blob.size){note('Recording came back empty.');return}
    await saveFile(`reel-forge-${S.mode}-${w}x${h}.webm`,blob);
  };
  recStart=performance.now();phase=0;rec.start(250);
  setTimeout(()=>{if(rec.state==='recording')rec.stop()},S.loop*1000+60);
});
$('expPng').addEventListener('click',async()=>{
  if(!renderer||exporting)return;
  const [w,h]=exportSize();beginExport(w,h);
  const keep=phase;
  tickFn&&tickFn(phase);renderer.render(scene,camera);
  const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));
  phase=keep;endExport();
  if(!blob){note('Could not make the image.');return}
  await saveFile(`reel-forge-${S.mode}-${w}x${h}.png`,blob);
});
$('expGltf').addEventListener('click',async()=>{
  if(!content)return;
  try{
    note('Building glTF…');
    const {GLTFExporter}=await import('three/addons/exporters/GLTFExporter.js');
    const result=await new GLTFExporter().parseAsync(content,{binary:false,onlyVisible:true});
    await saveFile('reel-forge-'+S.mode+'.gltf.json',JSON.stringify(result));
    note('glTF saved as .json. Rename it to .gltf to open it in 3D tools.');
  }catch(e){console.error(e);note('This object could not be exported as glTF.')}
});
$('expJson').addEventListener('click',()=>saveFile('reel-forge-preset.json',JSON.stringify(S,null,2)));
$('loadJson').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const o=JSON.parse(r.result);
      Object.keys(DEF).forEach(k=>{if(k in o&&typeof o[k]===typeof DEF[k])S[k]=o[k]});
      document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',String(t.dataset.mode===S.mode)));
      $('resSel').value=S.resolution;$('fpsSel').value=String(S.fps);buildPanel();layout();rebuild(true);note('Preset loaded.');
    }catch(err){note('That file is not a Reel Forge preset.')}
  };
  r.readAsText(f);e.target.value='';
});
function updateExpSummary(){
  const [w,h]=exportSize();
  $('expSum').textContent=`${w}×${h} px · ${S.loop} s loop · ${$('fpsSel').value} fps · ${(S.exportBg==='alpha'||S.bg==='checker')?'transparent':'solid'} background`;
}
$('resSel').addEventListener('change',e=>{S.resolution=e.target.value;updateExpSummary()});
$('fpsSel').addEventListener('change',e=>{S.fps=+e.target.value;updateExpSummary()});
$('resetBtn').addEventListener('click',()=>{
  if(RAIL==='canvas'){CANVAS_KEYS.forEach(k=>{S[k]=DEF[k]});buildPanel();layout();return}
  const mode=S.mode;
  Object.keys(DEF).forEach(k=>{if(!CANVAS_KEYS.includes(k)&&!['resolution','fps','mode'].includes(k))S[k]=JSON.parse(JSON.stringify(DEF[k]))});
  S.mode=mode;S.spin=MODE_SPIN[mode];
  buildPanel();rebuild(true);
});
$('jumpExport').addEventListener('click',()=>{setRail('export');$('rail').scrollIntoView({behavior:'smooth',block:'start'})});

/* ------------------------------------------------------------------ boot */
buildTabs();buildRail();buildPanel();updateTime();
(async()=>{
  try{
    setStatus('Starting 3D…');
    await initThree();
    requestAnimationFrame(frameLoop);
    await rebuild(true);
  }catch(e){
    console.error(e);
    setStatus('3D could not start. This browser needs WebGL and a connection to load three.js.',true);
  }
})();
</script>
