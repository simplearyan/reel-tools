<html lang="en"><head><meta charset="utf-8">

<title>Voice Match</title>
<style>

:root[data-theme="dark"]{--bg:#121816;--card:#1a2220;--ink:#e8eeec;--mute:#93a19c;--line:#2b3733;--accent:#4fd1b8;--ok:#fb923c;--btn:#4fd1b8;--btnink:#08201b;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}

button,select,input[type=text]{font:inherit;color:inherit}
.ic{background:none;border:1px solid var(--line);border-radius:10px;width:40px;height:40px;cursor:pointer}

</style></head><body><main>

<section id="learn">
<div class="grid"><div class="zone" id="zA"></div><div class="zone" id="zB"></div></div>
<button class="btn" id="go" disabled>Match voices</button>
<div class="mute" id="st">Import the same script spoken by two voices.</div>
<div class="panel" id="res" hidden>
<canvas id="cv"></canvas>
<div class="leg"><span><i style="background:var(--accent)"></i>Reference pitch</span><span><i style="background:var(--mute)"></i>Source pitch</span><span><i style="background:var(--ok)"></i>Result pitch</span></div>
<div class="stats" id="stats"></div>
<audio id="au1" controls></audio>
<div class="row"><a id="dl1" download="matched.wav"><button class="btn ghost">Download WAV</button></a>
<input type="text" id="pn" placeholder="Profile name"><button class="btn ghost" id="sv">Save profile</button></div>
<details><summary>Alignment table</summary><table id="tb"></table></details>
</div></section>

<section id="apply" hidden>
<div class="row"><select id="ps"></select></div>
<div class="zone" id="zC" style="margin-top:12px"></div>
<label class="mute" style="display:block;margin-top:12px"><input type="checkbox" id="nat"> De-robotize AI voice (natural pitch and timing drift)</label>
<button class="btn" id="go2" disabled>Convert</button>
<div class="mute" id="st2">Works with any recording, including AI-generated voices.</div>
<div class="panel" id="res2" hidden><div class="stats" id="stats2"></div><audio id="au2" controls></audio>
<div class="row"><a id="dl2" download="converted.wav"><button class="btn ghost">Download WAV</button></a></div></div>
</section>

<details><summary>Options</summary><div class="opt">
<label>Pitch match <input type="range" id="pm" value="100"></label>
<label>Tone match <input type="range" id="tm" value="100"></label>

<label>Room <input type="range" id="rm" value="15"></label>
<label>Leveling &amp; de-ess <input type="range" id="lv" value="50"></label>
<label><span><input type="checkbox" id="tim" checked> Match timing</span></label></div></details>
</main>

w(0,'RIFF');b.setUint32(4,36+n*3,true);w(8,'WAVEfmt ');b.setUint32(16,16,true);b.setUint16(20,1,true);b.setUint16(22,1,true);b.setUint32(24,buf.sampleRate,true);b.setUint32(28,buf.sampleRate*3,true);b.setUint16(32,3,true);b.setUint16(34,24,true);w(36,'data');b.setUint32(40,n*3,true);
for(let i=0;i<n;i++){const v=Math.round(Math.max(-1,Math.min(1,x[i]))*8388607);b.setUint8(44+i*3,v&255);b.setUint8(45+i*3,(v>>8)&255);b.setUint8(46+i*3,(v>>16)&255)}return new Blob([b],{type:'audio/wav'})}
// ---------- Learn ----------
const stat=(el,items)=>el.innerHTML=items.map(([l,v])=>`<div>${l}<strong>${v}</strong></div>`).join('');
const show=(au,dl,buf)=>{const u=URL.createObjectURL(wav24(buf));au.src=u;dl.href=u};
$('#go').onclick=async()=>{const A=S.A,B=S.B,o=opt(),st=$('#st');$('#go').disabled=true;
try{st.textContent='Analyzing both voices…';await tick();const a=analyze(A.x,A.sr),b=analyze(B.x,B.sr),c0=1024/A.sr,hopT=a.hop/A.sr;
const nrm=(q,av)=>q.feat.map(v=>v.map((z,k)=>z-av[k])),fa=nrm(a,a.avg),fb=nrm(b,b.avg);
st.textContent='Aligning timing (DTW)…';await tick();const path=dtw(fa,fb);
const sm=new Float64Array(a.nf),ct=new Float64Array(a.nf),ls=new Float64Array(b.nf),lc=new Float64Array(b.nf);
path.forEach(([i,j])=>{sm[i]+=j;ct[i]++;if(a.f0[i]>0&&b.f0[j]>0){ls[j]+=Math.log(a.f0[i]/b.f0[j]);lc[j]++}});
let mp=smooth(Float32Array.from(sm,(v,i)=>ct[i]?v/ct[i]:0),3);for(let i=1;i<mp.length;i++)mp[i]=Math.max(mp[i],mp[i-1]);
const rs=fillSmooth(Float32Array.from(ls,(v,j)=>lc[j]?v/lc[j]:NaN),Math.log(a.med/b.med)),eq=eqFrom(a.avg,b.avg);
st.textContent='Rendering…';await tick();
const srcAt=o.tim?t=>at(mp,(t-c0)/hopT)*hopT+c0:t=>t,outLen=o.tim?A.x.length:B.x.length;
const gm=a.feat.map((v,i)=>{const bv=b.feat[Math.round(mp[i])],g=Array.from(v,(q,k)=>q-bv[k]),m=mean(g);return g.map(z=>Math.max(-9,Math.min(9,z-m)))});
for(let k=0;k<NB;k++){const col=smooth(Float32Array.from(gm,r=>r[k]),6);gm.forEach((r,i)=>r[k]=col[i])}
const rt=rt60(a.rms),res=await render(B.x,B.sr,plan(b,o,srcAt,rs,o.tim?t=>gm[Math.max(0,Math.min(gm.length-1,Math.round((t-c0)/hopT)))]:()=>eq,rt,outLen,B.sr));
const ra=analyze(res.getChannelData(0),res.sampleRate),sB=score(a.avg,b.avg),sR=score(a.avg,ra.avg);
lastProf={rt,medA:a.med,medB:b.med,k:Math.max(.5,Math.min(1.8,a.sd/b.sd)),eq,speed:Math.max(.6,Math.min(1.6,a.ac/b.ac))};
const bf=new Float32Array(a.nf);for(let i=0;i<a.nf;i++)bf[i]=b.f0[Math.round(mp[i])]||0;
last={med:a.med,lines:[[a.f0,'--accent'],[bf,'--mute'],[ra.f0,'--ok']]};$('#res').hidden=false;draw();
stat($('#stats'),[['Timing',((outLen/B.x.length-1)*100).toFixed(1)+'%'],['Pitch shift',(a.med-b.med>0?'+':'')+(a.med-b.med).toFixed(0)+' Hz'],['Tone match',sB+' → '+sR]]);
show($('#au1'),$('#dl1'),res);$('#pn').value=$('#pn').value||'Voice '+(loadP().length+1);
const rows=[0,1,2,3,4,5].map(k=>{const i=Math.round(k*(a.nf-1)/5);return`<tr><td>${(i*hopT).toFixed(2)}s</td><td>${(mp[i]*hopT).toFixed(2)}s</td></tr>`}).join('');
$('#tb').innerHTML='<tr><th>Reference</th><th>Source</th></tr>'+rows;st.textContent='Done. Save the profile to reuse it on other recordings.'}
catch(e){st.textContent='Something went wrong: '+e.message}$('#go').disabled=false};
function draw(){if(!last)return;const c=$('#cv'),r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;const g=c.getContext('2d');g.scale(d,d);const W=r.width,H=r.height,cs=getComputedStyle(document.documentElement),sc=(H/2-8)/14;
g.strokeStyle=cs.getPropertyValue('--line');g.lineWidth=1;[-12,-6,0,6,12].forEach(k=>{g.beginPath();g.moveTo(0,H/2-k*sc);g.lineTo(W,H/2-k*sc);g.stroke()});
last.lines.forEach(([a,col])=>{g.strokeStyle=cs.getPropertyValue(col).trim();g.lineWidth=2;g.beginPath();let pen=false;a.forEach((v,i)=>{if(!v){pen=false;return}const x=i/(a.length-1)*W,y=H/2-Math.max(-14,Math.min(14,12*Math.log2(v/last.med)))*sc;pen?g.lineTo(x,y):g.moveTo(x,y);pen=true});g.stroke()})}
addEventListener('resize',draw);
// ---------- Profiles ----------
function loadP(){try{return JSON.parse(localStorage.getItem('vm_profiles')||'[]')}catch(e){return[]}}
function fillSel(){const s=$('#ps'),p=loadP();s.innerHTML='<option value="-1">No profile (realism only)</option>'+p.map((q,i)=>`<option value="${i}">${q.name}</option>`).join('');if(p.length)s.value=p.length-1}
$('#sv').onclick=()=>{if(!lastProf)return;const p=loadP();p.push({...lastProf,name:$('#pn').value||'Voice'});try{localStorage.setItem('vm_profiles',JSON.stringify(p))}catch(e){$('#st').textContent='Storage is unavailable in this browser.';return}fillSel();$('#st').textContent='Profile saved. Open Apply to use it.'};
fillSel();
// ---------- Apply ----------
$('#go2').onclick=async()=>{const C=S.C,o=opt(),p=loadP()[+$('#ps').value],st=$('#st2');$('#go2').disabled=true;
try{st.textContent='Processing…';await tick();const a=analyze(C.x,C.sr),c0=1024/C.sr,hopT=a.hop/C.sr,sp=p&&o.tim?p.speed:1;let eq=new Array(NB).fill(0),rs=new Float32Array(a.nf);
if(p){eq=p.eq;const lr=Float32Array.from(a.f0,f=>f>0?Math.log(p.medA*Math.exp(p.k*(Math.log(f)-Math.log(p.medB)))/f):NaN);rs=fillSmooth(lr,Math.log(p.medA/p.medB))}
const outLen=Math.round(C.x.length*sp),res=await render(C.x,C.sr,plan(a,o,t=>t/sp,rs,()=>eq,p&&p.rt?p.rt:.3,outLen,C.sr));
const ra=analyze(res.getChannelData(0),res.sampleRate);$('#res2').hidden=false;
stat($('#stats2'),[['Timing',((sp-1)*100).toFixed(1)+'%'],['Pitch shift',(ra.med-a.med>0?'+':'')+(ra.med-a.med).toFixed(0)+' Hz'],['Realism',Math.round(o.h*100)+'%']]);
show($('#au2'),$('#dl2'),res);st.textContent='Done.'}catch(e){st.textContent='Something went wrong: '+e.message}$('#go2').disabled=false};
</script></body></html>
