h=menu+n(+i-1,'Prev','<path d="m15 6-6 6 6 6"/>')+n(+i+1,'Next','<path d="m9 6 6 6-6 6"/>')+`<button data-act="tmenu">${ic(dotsP)}More</button>`}
else h=`<a href="#/" ${r=='home'?'aria-current="page"':''}>${ic('<path d="M3 11 12 4l9 7v9H3z"/>')}Home</a><a href="#/syllabus" ${r=='syllabus'?'aria-current="page"':''}>${ic('<path d="M4 5h6a2 2 0 0 1 2 2v12a2 2 0 0 0-2-2H4zM20 5h-6a2 2 0 0 0-2 2v12a2 2 0 0 1 2-2h6z"/>')}Syllabus</a><button data-act="search">${ic('<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>')}Search</button>`+menu;
$('#bnav').innerHTML=h}
(()=>{const m=$('#main'),app=$('#app');let y=0;m.addEventListener('scroll',()=>{const d=m.scrollTop-y;if(Math.abs(d)<8)return;y=m.scrollTop;if($('.top').classList.contains('sopen')||document.activeElement==$('#q'))return;app.classList.toggle('h',d>0&&m.scrollTop>80)},{passive:true});$('#q').addEventListener('focus',()=>app.classList.remove('h'))})();
/* reader menu */
function tmenu(b){const m=$('#tmenu');if(!m.hidden&&m._b===b){m.hidden=true;return}m._b=b;let bm=0;try{bm=JSON.parse(localStorage.getItem('rv-bm')||'[]').includes(CUR)}catch(e){}
m.innerHTML=`<div class="mi"><span>Text size</span><span class="split"><button class="b sm" data-act="fs-" aria-label="Smaller text">A−</button><button class="b sm" data-act="fs+" aria-label="Larger text">A+</button></span></div><button class="mi" role="menuitem" data-act="focus">Focus mode</button><button class="mi" role="menuitem" data-act="bm">${bm?'Remove bookmark':'Bookmark'}</button><button class="mi" role="menuitem" data-act="cpage">${copyI}Copy as Markdown</button><button class="mi" role="menuitem" data-act="pdf">Save as PDF</button>`;
m.hidden=false;const r=b.getBoundingClientRect(),w=m.offsetWidth;m.style.left=Math.max(8,Math.min(r.right-w,innerWidth-w-8))+'px';m.style.top=r.bottom+8+'px'}
document.addEventListener('click',e=>{const t=e.target.closest('#tmenu [data-act]');if(t&&!/^fs/.test(t.dataset.act))$('#tmenu').hidden=true});
/* resume reading */
let pt;function savePos(){const m=$('#main'),k=CUR,r=m.scrollTop/(m.scrollHeight-m.clientHeight||1);clearTimeout(pt);pt=setTimeout(()=>{try{const o=JSON.parse(localStorage.getItem('rv-pos')||'{}');o[k]=r;localStorage.setItem('rv-pos',JSON.stringify(o))}catch(e){}},250)}
function resume(){try{const a=localStorage.getItem('rv-last'),[c,w,i]=(a||'').split('/'),it=C.find(x=>x.id==c)?.weeks[+w]?.[6]?.[+i];if(!it)return'';const p=Math.round((JSON.parse(localStorage.getItem('rv-pos')||'{}')[a]||0)*100);return p>2&&p<97?`<a class="b resume" href="#/read/${a}">Continue reading · ${esc(it[1])} · ${p}%</a>`:''}catch(e){return''}}
/* press-and-hold selection */
const SEL=new Set();let lp,lx,ly,lpd=0;
function selUI(){document.body.classList.toggle('sel',SEL.size>0);$$('.row').forEach(r=>r.classList.toggle('on',SEL.has(r.dataset.k)));const b=$('#selbar');b.hidden=!SEL.size;b.innerHTML=`<span>${SEL.size} selected</span><button class="b" data-act="selcopy">${copyI}Copy</button><button class="b" data-act="selx">Cancel</button>`}
function selClear(){SEL.clear();selUI()}
function toggleSel(r){const k=r.dataset.k;SEL.has(k)?SEL.delete(k):SEL.add(k);selUI()}
function selCopy(){const L=[],multi=new Set([...SEL].map(k=>k.split('/').slice(0,2).join())).size>1;let last='';$$('.row.on').forEach(r=>{const[c,w,i]=r.dataset.k.split('/'),c0=C.find(x=>x.id==c),wk=c0.weeks[+w];if(multi&&c+w!=last){if(last)L.push('');L.push('## '+c0.name+' · '+wk[0]);last=c+w}L.push('- '+line(c0,wk,wk[6][+i]))});const n=SEL.size;copy(L.join('\n')+'\n',n+' page'+(n>1?'s':'')+' copied');selClear()}
document.addEventListener('pointerdown',e=>{const r=e.target.closest('.row');lpd=0;if(!r||e.button)return;lx=e.clientX;ly=e.clientY;clearTimeout(lp);lp=setTimeout(()=>{lpd=1;toggleSel(r);navigator.vibrate&&navigator.vibrate(12)},450)});
document.addEventListener('pointermove',e=>{if(Math.hypot(e.clientX-lx,e.clientY-ly)>8)clearTimeout(lp)});
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,()=>clearTimeout(lp)));
document.addEventListener('click',e=>{const r=e.target.closest('.row');if(!r)return;if(lpd){lpd=0;e.preventDefault();e.stopPropagation();return}if(SEL.size){e.preventDefault();e.stopPropagation();toggleSel(r)}},true);
document.addEventListener('contextmenu',e=>{if(e.target.closest('.row')&&(SEL.size||lpd||matchMedia('(pointer:coarse)').matches))e.preventDefault()});
addEventListener('keydown',e=>{if(e.key=='Escape'){selClear();$('#tmenu').hidden=true}if(e.key==' '&&e.target.matches('.row .t')){e.preventDefault();toggleSel(e.target.closest('.row'))}});
/* reader: swipe + arrow keys for previous / next page */
(()=>{const m=$('#main'),nv=k=>{const a=CURH.startsWith('#/read/')&&$('.pn [rel='+k+']');if(a)go(a.getAttribute('href'))};let s=null;
m.addEventListener('touchstart',e=>{const t=e.touches[0];s=e.touches.length==1&&t.clientX>24?[t.clientX,t.clientY]:null},{passive:true});
m.addEventListener('touchend',e=>{if(!s)return;const t=e.changedTouches[0],dx=t.clientX-s[0],dy=t.clientY-s[1];s=null;if(Math.abs(dx)>70&&Math.abs(dx)>2*Math.abs(dy))nv(dx<0?'next':'prev')},{passive:true});
addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||/INPUT|TEXTAREA/.test(e.target.tagName))return;const k={ArrowRight:'next',ArrowLeft:'prev'}[e.key];k&&nv(k)})})();
route();
</script></body></html>
