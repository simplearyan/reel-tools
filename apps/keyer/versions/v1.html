<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keyer – remove video backgrounds</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f7;--sf:#fff;--sf2:#eceef2;--on:#14171a;--on2:#5b6570;--ol:#dde1e6;--ac:#1a56db;--onac:#fff;--ck1:#e6e9ee;--ck2:#fff;
box-sizing:border-box;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#101214;--sf:#171a1d;--sf2:#212529;--on:#eceff2;--on2:#98a2ac;--ol:#2b3036;--ac:#8ab4f8;--onac:#0b2a5b;--ck1:#23272c;--ck2:#2f343a}}
:root[data-theme=dark]{--bg:#101214;--sf:#171a1d;--sf2:#212529;--on:#eceff2;--on2:#98a2ac;--ol:#2b3036;--ac:#8ab4f8;--onac:#0b2a5b;--ck1:#23272c;--ck2:#2f343a}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{display:grid;grid-template-rows:auto minmax(0,1fr);height:100dvh;background:var(--bg);color:var(--on);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
header{display:flex;align-items:center;gap:8px;padding:12px 16px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}.brand b{font-size:18px;letter-spacing:-.01em}.brand span{color:var(--on2);font-size:13px}
.btn{height:38px;padding:0 16px;border-radius:10px;border:1px solid var(--ol);background:var(--sf);font-weight:400}
.btn:hover{background:var(--sf2)}.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--onac)}.btn.pri:hover{filter:brightness(1.08)}.btn:disabled{opacity:.45;cursor:default}
.ib{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--on2)}.ib:hover{background:var(--sf2);color:var(--on)}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"stage panel" "ctl panel";gap:12px;padding:0 16px 16px;min-height:0}
.stage{grid-area:stage;position:relative;display:grid;place-items:center;background:var(--sf);border:1px solid var(--ol);border-radius:16px;overflow:hidden;min-height:0;padding:12px}
canvas{display:block;border-radius:8px;background-color:var(--ck2);background-image:conic-gradient(var(--ck1) 25%,transparent 0 50%,var(--ck1) 0 75%,transparent 0);background-size:20px 20px;touch-action:none}
canvas.pick{cursor:crosshair}
.drop{position:absolute;inset:12px;display:grid;place-content:center;justify-items:center;gap:6px;border:2px dashed var(--ol);border-radius:12px;text-align:center;color:var(--on2);cursor:pointer;background:var(--sf)}
.drop b{color:var(--on);font-size:16px}.drop:hover,.stage.over .drop{border-color:var(--ac)}
.ctl{grid-area:ctl;display:flex;align-items:center;gap:10px;background:var(--sf);border:1px solid var(--ol);border-radius:16px;padding:8px 12px}
.ctl input[type=range]{flex:1;min-width:80px}.time{font-variant-numeric:tabular-nums;color:var(--on2);min-width:92px;text-align:right}
.seg{display:flex;background:var(--sf2);border-radius:10px;padding:3px;gap:2px}.seg button{flex:1;height:30px;padding:0 12px;border-radius:8px;color:var(--on2);white-space:nowrap}.seg button.on{background:var(--sf);color:var(--on);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.panel{grid-area:panel;background:var(--sf);border:1px solid var(--ol);border-radius:16px;padding:16px;overflow:auto;display:grid;align-content:start;gap:20px}
.panel section{display:grid;gap:12px}.panel h3{margin:0;font-size:13px;font-weight:600}
.hint{margin:0;color:var(--on2);font-size:12.5px}
.sl{display:grid;grid-template-columns:1fr auto;gap:2px 8px}.sl span{color:var(--on2)}.sl output{font-variant-numeric:tabular-nums}.sl input{grid-column:1/3}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;margin:0;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--sf2) var(--a,0%),var(--ac) var(--a,0%),var(--ac) var(--b,0%),var(--sf2) var(--b,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-6px;border-radius:50%;background:var(--sf);border:2px solid var(--ac);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .12s}
input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.15)}
input[type=range]:focus-visible{outline:none}input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 28%,transparent)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--sf2)}input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--ac)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--sf);border:2px solid var(--ac)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row .btn{height:34px;padding:0 12px;font-size:13px}.btn.on{background:var(--sf2);border-color:var(--on2)}
input[type=color]{width:38px;height:34px;padding:2px;border:1px solid var(--ol);border-radius:8px;background:var(--sf);cursor:pointer}
.sws{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{width:30px;height:30px;border-radius:50%;border:1px solid var(--ol);box-shadow:inset 0 0 0 2px var(--sf)}.sw.on{outline:2px solid var(--ac);outline-offset:2px}
.sw.ck{background:conic-gradient(var(--ck1) 25%,var(--ck2) 0 50%,var(--ck1) 0 75%,var(--ck2) 0) 0 0/10px 10px}
select{height:34px;border-radius:8px;border:1px solid var(--ol);background:var(--sf);color:var(--on);padding:0 8px;font:inherit}
.info{color:var(--on2);font-size:12px;word-break:break-word}
.dlg{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.45);z-index:10}
.dlg>div{background:var(--sf);border-radius:20px;padding:20px;width:min(400px,90vw);display:grid;gap:10px;border:1px solid var(--ol)}
.dlg h2{margin:0 0 4px;font-size:16px}.opt{text-align:left;padding:10px 12px;border:1px solid var(--ol);border-radius:12px}.opt:hover{background:var(--sf2)}.opt b{display:block}.opt span{color:var(--on2);font-size:12.5px}
.bar{height:6px;border-radius:3px;background:var(--sf2);overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--ac)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--on);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw}#toast.on{opacity:1}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
@media(max-width:860px){body{height:auto;min-height:100dvh}main{grid-template-columns:minmax(0,1fr);grid-template-rows:auto;grid-template-areas:"stage" "ctl" "panel"}.stage{height:min(62vw,420px);min-height:220px}.brand span{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.views{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:var(--sf);border:1px solid var(--ol);box-shadow:0 2px 10px rgba(0,0,0,.1)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{height:28px;padding:0 12px;border-radius:14px;border:1px solid var(--ol);font-size:12.5px;color:var(--on2)}.chip:hover{color:var(--on);background:var(--sf2)}
.phead{display:flex;justify-content:space-between;align-items:center}.phead b{font-size:15px;font-weight:600}
.link{color:var(--ac);font-size:12.5px;font-weight:400}.link:hover{text-decoration:underline}
details{border-top:1px solid var(--ol);padding-top:14px}details>*+*{margin-top:12px}
summary{cursor:pointer;font-weight:600;font-size:13px;list-style:none;display:flex;justify-content:space-between;align-items:center}summary::-webkit-details-marker{display:none}
summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--on2);border-bottom:2px solid var(--on2);transform:rotate(45deg);transition:transform .15s;margin-right:4px}details[open]>summary::after{transform:rotate(-135deg)}
.panel>section+section,.panel>details{margin-top:0}.panel>section+section{border-top:1px solid var(--ol);padding-top:18px}
.ib.on{color:var(--ac);background:var(--sf2)}.sl span{font-size:13px}.sl output{font-size:12.5px;color:var(--on);background:var(--sf2);padding:0 8px;border-radius:6px;min-width:36px;text-align:center}
.panel{scrollbar-width:thin}
.grp{display:grid;gap:14px}.panel>section>h3{margin-bottom:-2px}.panel>details+section,.panel>section+details{border-top:1px solid var(--ol);padding-top:18px}.panel>details{padding-bottom:2px}
.frame{position:relative}.frame canvas{width:100%;height:100%}
.keys{display:flex;gap:8px;flex-wrap:wrap;min-height:34px;align-items:center}.keys:empty::before{content:"No colors yet";color:var(--on2);font-size:12.5px}
.ks{position:relative;width:34px;height:34px}.ks input{width:34px;height:34px;padding:0;border:1px solid var(--ol);border-radius:50%;background:var(--sf);cursor:pointer;-webkit-appearance:none;appearance:none}
.ks input::-webkit-color-swatch-wrapper{padding:2px}.ks input::-webkit-color-swatch{border:0;border-radius:50%}.ks input::-moz-color-swatch{border:0;border-radius:50%}
.ks .x{position:absolute;top:-5px;right:-5px;width:16px;height:16px;border-radius:50%;background:var(--on);color:var(--bg);font-size:11px;line-height:16px;text-align:center;opacity:0;transition:opacity .12s}
.ks:hover .x,.ks:focus-within .x{opacity:1}@media(hover:none){.ks .x{opacity:1}}
.tg{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:400;position:relative}.tg input{position:absolute;opacity:0;width:0;height:0}
.tg .knob{width:36px;height:20px;border-radius:10px;background:var(--sf2);border:1px solid var(--ol);position:relative;transition:background .15s}
.tg .knob::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--on2);transition:transform .15s,background .15s}
.tg input:checked+.knob{background:var(--ac);border-color:var(--ac)}.tg input:checked+.knob::after{transform:translateX(16px);background:var(--onac)}.tg input:focus-visible+.knob{outline:2px solid var(--ac);outline-offset:2px}
#hz{position:absolute;inset:0;pointer-events:none}#hz[hidden]{display:none}#hz svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#hz line{stroke:#fff;stroke-width:2;stroke-dasharray:6 5;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 2px rgba(0,0,0,.7))}
.hh{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:#fff;border:2px solid var(--ac);box-shadow:0 1px 4px rgba(0,0,0,.45);pointer-events:auto;cursor:ns-resize;touch-action:none}
.hl{position:absolute;left:14px;font-size:11px;font-weight:600;color:#fff;background:rgba(0,0,0,.6);padding:1px 8px;border-radius:10px;transform:translateY(-135%);pointer-events:none}
.adv{margin-top:2px}.views button{padding:0 10px}
.ptabs{margin:0}.tab{display:grid;gap:20px}.tab>section+section,.tab>section+details,.tab>details+section{border-top:1px solid var(--ol);padding-top:18px}
#mo{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;border-radius:8px;background:none!important}
#ring{position:absolute;border:1.5px solid #fff;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.55);pointer-events:none;transform:translate(-50%,-50%);display:none}
canvas.paint{cursor:none}
.mbar{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;background:var(--sf);border:1px solid var(--ol);border-radius:14px;padding:8px 12px;box-shadow:0 2px 12px rgba(0,0,0,.18);flex-wrap:wrap;justify-content:center;max-width:calc(100% - 24px);z-index:3}
.mbar label{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--on2)}.mbar input[type=range]{width:90px}.mbar .btn{height:32px;padding:0 14px}
#shp{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}#shp path{fill:rgba(255,255,255,.16);stroke:#fff;stroke-width:2;stroke-dasharray:6 5;vector-effect:non-scaling-stroke}
.mrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center;width:100%}.mbar .seg button{padding:0 10px;font-size:12.5px}
/* ===== calm visual system: soft surfaces, one control size, two weights, accent only where it matters ===== */
:root{--r:8px;--rc:12px;--h:32px}
body{font-weight:400}b,strong{font-weight:600}
header{padding:16px}.brand b{font-size:16px;font-weight:600}.brand span{font-size:13px}
.btn{height:var(--h);padding:0 14px;border:0;border-radius:var(--r);background:var(--sf2);font-size:13px;font-weight:400;color:var(--on)}
.btn:hover{background:color-mix(in srgb,var(--on) 10%,var(--sf2))}
.btn.pri{background:var(--ac);color:var(--onac);font-weight:600}.btn.pri:hover{background:var(--ac);filter:brightness(1.08)}
.btn.on{background:var(--sf2);box-shadow:inset 0 0 0 1.5px var(--on)}
.row .btn{height:var(--h);padding:0 14px;font-size:13px}
.ib{width:var(--h);height:var(--h);border-radius:var(--r);color:var(--on2)}.ib.on{color:var(--on);background:var(--sf2)}
.chip{height:var(--h);padding:0 14px;border:0;border-radius:var(--r);background:var(--sf2);font-size:13px;color:var(--on)}.chip:hover{background:color-mix(in srgb,var(--on) 10%,var(--sf2))}
.chips{gap:8px}
.seg{height:var(--h);padding:2px;border-radius:var(--r);background:var(--sf2);gap:2px}
.seg button{height:28px;padding:0 12px;border-radius:6px;font-size:13px;font-weight:400;color:var(--on2)}
.seg button.on{background:color-mix(in srgb,var(--ac) 16%,transparent);color:var(--ac);font-weight:600;box-shadow:none}
.views,.mbar{border:0;box-shadow:0 2px 12px rgba(0,0,0,.16)}
main{gap:16px;padding:0 16px 16px}
.stage,.ctl,.panel{border:0;border-radius:var(--rc)}.stage{padding:16px}.ctl{padding:8px 16px;gap:16px}
.drop{inset:16px;border:0;background:var(--sf2);border-radius:var(--rc)}.drop:hover,.stage.over .drop{background:color-mix(in srgb,var(--on) 8%,var(--sf2))}.drop b{font-size:16px;font-weight:600}
.time{font-size:13px}
.panel{padding:16px;gap:24px}.tab{gap:24px}.grp{gap:16px}.panel section{gap:16px}
.panel>section+section,.tab>section+section,.tab>section+details,.tab>details+section,details{border-top:0;padding-top:0}
.panel h3{font-size:13px;font-weight:600;margin:0}.phead b{font-size:16px;font-weight:600}
.hint{font-size:12px}.info{font-size:12px}
.link{color:var(--on2);font-size:13px;font-weight:400}.link:hover{color:var(--on);text-decoration:underline}
summary{height:var(--h);padding:0 12px;border-radius:var(--r);background:var(--sf2);font-size:13px;font-weight:600}details>*+*{margin-top:16px}
select{height:var(--h);border:0;border-radius:var(--r);background:var(--sf2);font-size:13px;padding:0 12px}
input[type=color]{height:var(--h);width:var(--h);border:0;border-radius:var(--r);background:var(--sf2)}
.ks,.ks input{width:var(--h);height:var(--h)}.ks input{border:0;background:var(--sf2)}.ks .x{font-size:12px}
.sw{width:var(--h);height:var(--h);border:0;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--on) 14%,transparent)}.sw.on{outline:2px solid var(--on);outline-offset:2px}
.sws,.keys,.row{gap:8px}
.tg .knob{border:0;background:var(--sf2)}.tg input:checked+.knob{background:var(--on)}.tg input:checked+.knob::after{background:var(--bg)}
.sl{grid-template-columns:1fr auto;gap:4px 8px;align-items:center}.sl span{font-size:13px;color:var(--on2)}
.num{width:48px;height:24px;padding:0;text-align:center;border:0;border-radius:var(--r);background:var(--sf2);color:var(--on);font:inherit;font-size:12px;font-variant-numeric:tabular-nums;grid-column:2;grid-row:1}
.num:hover{background:color-mix(in srgb,var(--on) 10%,var(--sf2))}.num:focus{outline:2px solid var(--ac);outline-offset:0;background:var(--sf)}
input[type=range]::-webkit-slider-thumb{background:#fff;border:0;box-shadow:0 1px 4px rgba(0,0,0,.4)}input[type=range]::-moz-range-thumb{background:#fff;border:0;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.hh{background:#fff;border:0;box-shadow:0 0 0 2px rgba(0,0,0,.55),0 1px 4px rgba(0,0,0,.4)}.hl{font-size:12px;font-weight:600}
.dlg>div{border:0;border-radius:var(--rc)}.opt{border:0;background:var(--sf2);border-radius:var(--r)}.opt:hover{background:color-mix(in srgb,var(--on) 10%,var(--sf2))}.opt span{font-size:12px}.dlg h2{font-weight:600}
#toast{font-size:13px;border-radius:var(--r)}.mbar label{font-size:12px}.mbar .btn{height:var(--h)}
.sl .num{grid-column:2;grid-row:1}.sl input[type=range]{grid-column:1/3}
#modes button{padding:0 4px}.panel .seg button{min-width:0;white-space:nowrap}.views button{flex:none;white-space:nowrap}#modes button,#ptabs button{font-size:12px;padding:0 4px}.panel{overflow-x:hidden}.mbar{cursor:grab}.mbar .seg,.mbar label,.mbar .btn,.mbar input{cursor:auto}
</style>

<body>
<header>
  <div class="brand"><b>Keyer</b><span>Remove video backgrounds in your browser</span></div>
  <button class="ib" id="theme" aria-label="Switch light or dark theme" title="Light / dark"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg></button>
  <button class="ib" id="undo" aria-label="Undo" title="Undo (Ctrl+Z)" disabled><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
  <button class="ib" id="redo" aria-label="Redo" title="Redo (Ctrl+Shift+Z)" disabled><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
  <button class="btn" id="open">Open video</button>
  <button class="btn pri" id="exp" disabled>Export</button>
</header>
<main>
  <section class="stage" id="stage">
    <div class="frame" id="frame"><canvas id="gl" width="16" height="9"></canvas><canvas id="mo" width="16" height="9" hidden></canvas><i id="ring"></i><svg id="shp" viewBox="0 0 100 100" preserveAspectRatio="none" hidden><path id="shpP" d=""/></svg><div id="hz" hidden><svg viewBox="0 0 100 100" preserveAspectRatio="none"><line id="hzl" x1="0" y1="60" x2="100" y2="60"/></svg><i class="hh" id="hhL"></i><i class="hh" id="hhM"></i><i class="hh" id="hhR"></i><span class="hl" id="hlab">Sky</span></div></div>
    <div class="seg views" id="views" hidden><button data-v="0" class="on">Result</button><button data-v="1">Matte</button><button data-v="2">Original</button><button data-v="3">Removed</button></div>
    <div class="mbar" id="mbar" hidden>
      <div class="mrow"><div class="seg" id="mtool"><button data-mt="k" class="on" title="Always keep (K)">Keep</button><button data-mt="r" title="Always remove (X)">Remove</button><button data-mt="e" title="Back to the key (E)">Erase</button></div>
       <div class="seg" id="mshape"><button data-sh="b" class="on" title="Brush (B)">Brush</button><button data-sh="w" title="Magic wand (W)">Wand</button><button data-sh="l" title="Lasso (L)">Lasso</button><button data-sh="r" title="Rectangle (R)">Rectangle</button><button data-sh="o" title="Ellipse (O)">Ellipse</button></div></div>
      <div class="mrow"><label id="lsz">Size<input type="range" id="bsz" min="1" max="30" value="6"></label><label id="ltol" hidden>Tolerance<input type="range" id="wtol" min="1" max="60" value="18"></label><label id="lcon" hidden><input type="checkbox" id="wcon" checked> Connected only</label><label>Softness<input type="range" id="bsf" min="0" max="100" value="40"></label><button class="btn" id="mdone">Done</button></div></div>
    <div class="drop" id="drop"><svg viewBox="0 0 24 24" style="width:32px;height:32px"><path d="M12 16V5M7 9l5-5 5 5M5 20h14"/></svg><b>Drop a video or image here</b><span>or click to choose a file (MP4, WebM, MOV, PNG, JPG)</span><span id="gpuMsg"></span></div>
  </section>
  <div class="ctl" id="ctl">
    <button class="ib" id="play" aria-label="Play or pause" disabled></button>

function drawStroke(st){

  else if(t=='r'){mk2d.fillRect(st.b[0]*mw,st.b[1]*mh,(st.b[2]-st.b[0])*mw,(st.b[3]-st.b[1])*mh)}

  else if(t=='w'){const g=wc.getContext('2d');wc.width=mw;wc.height=mh;const im=g.createImageData(mw,mh),o=im.data;
    for(let i=0;i<st.rle.length;i+=3){for(let x=st.rle[i+1],e=x+st.rle[i+2];x<e;x++){const q=(st.rle[i]*mw+x)*4;o[q]=col[0];o[q+1]=col[1];o[q+2]=col[2];o[q+3]=255}}

function rasterAll(){
  [[sk2d,false],[lk2d,true]].forEach(([c,l])=>{mk2d=c;c.fillStyle='rgb(128,128,128)';c.fillRect(0,0,mw,mh);strokes.forEach(st=>{if(!!st.l==l)drawStroke(st)})});mk2d=sk2d;
  maskDirty=true;trainLut();paintOverlay();if(vw)render();

function paintOverlay(){

  const a=sk2d.getImageData(0,0,mw,mh).data,b=lk2d.getImageData(0,0,mw,mh).data,g=oc.getContext('2d'),im=g.createImageData(mw,mh),o=im.data;
  for(let i=0;i<a.length;i+=4){const m=Math.abs(a[i]-128)>=Math.abs(b[i]-128)?a[i]:b[i];
    if(m>136){o[i]=40;o[i+1]=200;o[i+2]=120;o[i+3]=Math.min(110,(m-128)*1.0)}else if(m<120){o[i]=240;o[i+1]=60;o[i+2]=80;o[i+3]=Math.min(110,(128-m)*1.0)}}

}
const newStroke=o=>{o.id=++sid;if(P.mode==3&&o.m!='e')o.l=1;return o};
const drawTo=st=>{mk2d=st.l?lk2d:sk2d;drawStroke(st);mk2d=sk2d};
const segTo=(st,a,b)=>{mk2d=st.l?lk2d:sk2d;seg(st,a,b);mk2d=sk2d};
function doneStroke(st){if(st.l){trainStroke(st);trainLut()}maskDirty=true;maskPaint()}
const tcv=document.createElement('canvas'),tg=tcv.getContext('2d',{willReadFrequently:true}),fcv=document.createElement('canvas'),fg2=fcv.getContext('2d',{willReadFrequently:true});
const binOf=(r,g,b)=>{r/=255;g/=255;b/=255;const cb=-.168736*r-.331264*g+.5*b+.5,cr=.5*r-.418688*g-.081312*b+.5,y=.2126*r+.7152*g+.0722*b;
  return Math.min(15,Math.floor(y*16))*1024+Math.min(31,Math.floor(cr*32))*32+Math.min(31,Math.floor(cb*32))};
function trainStroke(st){
  if(st.m=='e')return;tcv.width=fcv.width=mw;tcv.height=fcv.height=mh;tg.fillStyle='#000';tg.fillRect(0,0,mw,mh);
  const old=mk2d;mk2d=tg;drawStroke({...st,m:'k',f:0});mk2d=old;
  const cov=tg.getImageData(0,0,mw,mh).data;fg2.drawImage(SRCEL(),0,0,mw,mh);const px=fg2.getImageData(0,0,mw,mh).data,acc=new Uint32Array(16384);
  for(let i=0;i<cov.length;i+=4)if(cov[i]>128)acc[binOf(px[i],px[i+1],px[i+2])]++;

}
const axis=(a,st,len)=>{const o=new Float32Array(a.length);for(let i=0;i<a.length;i++){const c=Math.floor(i/st)%len;o[i]=a[i]*.5+(c>0?a[i-st]:a[i])*.25+(c<len-1?a[i+st]:a[i])*.25}return o};

  strokes.forEach(st=>{if(!st.l)return;const h=HM[st.id];if(!h)return;const t=h.k=='k'?fgA:bgA;for(let i=0;i<h.b.length;i+=2){t[h.b[i]]+=h.b[i+1];if(h.k=='k')nf+=h.b[i+1];else nb+=h.b[i+1]}});
  [[1,32],[32,32],[1024,16]].forEach(([st,len])=>{fgA=axis(fgA,st,len);bgA=axis(bgA,st,len)});
  let sf=0,sb=0;for(let i=0;i<16384;i++){sf+=fgA[i];sb+=bgA[i]}

    lutData[q]=Math.round(pr*255);lutData[q+1]=Math.round(cf*255);lutData[q+2]=0;lutData[q+3]=255}
  lutDirty=true;const li=$('#learnInfo');if(li)li.textContent=nf||nb?`Learned ${nf.toLocaleString()} Keep and ${nb.toLocaleString()} Remove pixels.`:'No samples yet. Paint a few strokes on the subject and the background.';
}const maskPaint=()=>{if(mpq)return;mpq=requestAnimationFrame(()=>{mpq=0;paintOverlay();if(video.paused)frame()})};
function ring(e){if(shape!='b')return;const f=$('#frame').getBoundingClientRect(),r=$('#ring'),d=brush.s/100*f.width;r.style.display='block';r.style.width=r.style.height=d+'px';r.style.left=(e.clientX-f.left)+'px';r.style.top=(e.clientY-f.top)+'px'}
function syncBrush(){document.querySelector('#mtool [data-mt="e"]').hidden=P.mode==3;$('#bsz').value=brush.s;$('#bsf').value=brush.f;$('#wtol').value=wand.tol;$('#wcon').checked=wand.contig;['#bsz','#bsf','#wtol'].forEach(i=>paint($(i)));
  $('#lsz').hidden=shape!='b';$('#ltol').hidden=shape!='w';$('#lcon').hidden=shape!='w';
  document.querySelectorAll('#mshape button').forEach(b=>b.classList.toggle('on',b.dataset.sh==shape));
  cv.classList.toggle('paint',shape=='b'&&!!maskTool);cv.classList.toggle('pick',shape!='b'&&!!maskTool);if(shape!='b')$('#ring').style.display='none'}
const setShape=sh=>{shape=sh;if(!maskTool)setMaskTool('k');else syncBrush()};
$('#mshape').onclick=e=>{const b=e.target.closest('[data-sh]');if(b)setShape(b.dataset.sh)};
$('#wtol').oninput=e=>{wand.tol=+e.target.value;paint(e.target)};$('#wcon').onchange=e=>wand.contig=e.target.checked;
const shapeD=st=>{const T=v=>(v*100).toFixed(2);if(st.t=='l')return 'M'+st.p.map(q=>T(q[0])+' '+T(q[1])).join('L')+'Z';const [a,b,c,d]=st.b;
  if(st.t=='r')return `M${T(a)} ${T(b)}H${T(c)}V${T(d)}H${T(a)}Z`;const cx=(a+c)/2,cy=(b+d)/2,rx=Math.abs(c-a)/2,ry=Math.abs(d-b)/2;
