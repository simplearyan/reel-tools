                        if (State.dialogueDataArray[i] > maxVolume) {
                            maxVolume = State.dialogueDataArray[i];
                        }
                    }
                    
                    State.clips.forEach(clip => {
                        const track = State.tracks.find(t => t.id === clip.trackId);
                        const isAutoDuck = (clip.effects && clip.effects.autoDuck || (track && track.autoDuck)) && clip.audioNodes && clip.audioNodes.vocalPocket;
                        const isVolumeDuck = (clip.effects && clip.effects.volumeDuck || (track && track.volumeDuck)) && clip.audioNodes && clip.audioNodes.duckingVolume;
                        
                        if (isAutoDuck || isVolumeDuck) {
                            const duckThreshold = clip.effects.duckThreshold !== undefined ? parseFloat(clip.effects.duckThreshold) : 10;
                            const isCurrentlySpeaking = maxVolume > duckThreshold;
                            
                            if (isCurrentlySpeaking) {
                                clip.duckingLastDetected = performance.now();
                            }
                            const timeSinceDialogue = performance.now() - (clip.duckingLastDetected || 0);
                            const releaseTime = clip.effects.volumeDuckRelease !== undefined ? parseFloat(clip.effects.volumeDuckRelease) : 1000;
                            const isDucking = isCurrentlySpeaking || (timeSinceDialogue < releaseTime);
                            
                            // Auto-Duck (Frequency Pocket)
                            if (isAutoDuck) {
                                const duckGainTarget = clip.effects.autoDuckGain !== undefined ? parseFloat(clip.effects.autoDuckGain) : -18;
                                const targetGain = isDucking ? duckGainTarget : 0;
                                
                                const currentGain = clip.audioNodes.vocalPocket.gain.value;
                                const diff = targetGain - currentGain;
                                const smoothing = targetGain < currentGain ? 0.2 : 0.05;
                                clip.audioNodes.vocalPocket.gain.value = currentGain + (diff * smoothing);
                            }
                            
                            // Smart Volume Duck (Sidechain)
                            if (isVolumeDuck) {
                                const duckGainTarget = clip.effects.volumeDuckGain !== undefined ? parseFloat(clip.effects.volumeDuckGain) : 0.2; 
                                const recoveryVolume = clip.effects.volumeDuckRecovery !== undefined ? parseFloat(clip.effects.volumeDuckRecovery) : 1.0;
                                
                                const targetGain = isDucking ? duckGainTarget : recoveryVolume;
                                const currentGain = clip.audioNodes.duckingVolume.gain.value;
                                
                                const diff = targetGain - currentGain;
                                
                                const fadeInDuration = clip.effects.volumeDuckFadeIn !== undefined ? parseFloat(clip.effects.volumeDuckFadeIn) : 0.25;
                                const fadeOutDuration = clip.effects.volumeDuckFadeOut !== undefined ? parseFloat(clip.effects.volumeDuckFadeOut) : 1.0;
                                
                                const smoothing = Math.min(1.0, isDucking ? (0.05 / fadeInDuration) : (0.05 / fadeOutDuration));
                                clip.audioNodes.duckingVolume.gain.value = currentGain + (diff * smoothing);
                            }
                        }
                    });
                }
                
                drawCanvas();
            }
            
            updatePlayhead();
            requestAnimationFrame(loop);
        }

        // --- Export Engine ---

        function openExportModal() {

            document.getElementById('exportSettings').classList.remove('hidden');
            document.getElementById('exportProgress').classList.add('hidden');
        }

        function closeExportModal() {
            document.getElementById('exportOverlay').classList.add('hidden');
            document.getElementById('exportOverlay').classList.remove('flex');
        }

        function cancelExport() {
            if (State.isExporting) {
                State.cancelExport = true;
            } else {

                closeExportModal();
            }
        }

        function submitExport() {
            const format = document.querySelector('input[name="exportFormat"]:checked').value;
            const scope = document.querySelector('input[name="exportScope"]:checked').value;
            State.exportResolution = parseInt(document.querySelector('input[name="exportResolution"]:checked').value);
            
            let startT = 0;
            let endT = State.duration;
            
            if (scope === 'custom') {
                startT = parseFloat(document.getElementById('exportStartTime').value) || 0;
                endT = parseFloat(document.getElementById('exportEndTime').value) || State.duration;
            }
            
            document.getElementById('exportSettings').classList.add('hidden');
            document.getElementById('exportProgress').classList.remove('hidden');
            document.getElementById('exportProgressBar').style.width = '0%';
            document.getElementById('exportProgressText').textContent = '0%';
            
            startExport(format, startT, endT);
        }

        function startExport(format, startTime, endTime) {
            if (State.isExporting) return;
            ensureAudioContext();
            
            State.isExporting = true;
            State.cancelExport = false;
            
            stopMedia();
            State.currentTime = startTime;
            
            let exportCanvas = null;
            let exportCtx = null;
            let exportW, exportH;
            
            let finalStream;
            let mimeType;
            let extension;

            if (format.includes('video') || format === 'gif') {
                const aspectStr = ASPECT_RATIOS[State.preview.aspectIndex].value;
                const [wRatio, hRatio] = aspectStr.split('/').map(Number);
                const baseRes = State.exportResolution || 1920;
                
                if (wRatio >= hRatio) {
                    exportW = baseRes;
                    exportH = baseRes * (hRatio / wRatio);
                } else {
                    exportH = baseRes;
                    exportW = baseRes * (wRatio / hRatio);
                }
                
                exportCanvas = document.createElement('canvas');
                exportCanvas.width = exportW;
                exportCanvas.height = exportH;
                exportCtx = exportCanvas.getContext('2d');
                
                const canvasStream = exportCanvas.captureStream(30);
                const audioTracks = State.masterStreamNode.stream.getAudioTracks();
                if (audioTracks.length > 0) {
                    finalStream = new MediaStream([...canvasStream.getVideoTracks(), ...audioTracks]);
                } else {
                    finalStream = canvasStream;
                }
                
                if (format === 'video-mp4') {
                    mimeType = 'video/mp4;codecs="avc1, mp4a.40.2"'; // H.264 + AAC
                    extension = 'mp4';
                } else {
                    mimeType = 'video/webm;codecs=vp9,opus';
                    extension = format === 'gif' ? 'gif.webm' : 'webm';
                }
            } else {
                finalStream = State.masterStreamNode.stream;
                if (format === 'audio-wav') {
                    mimeType = 'audio/webm'; 
                    extension = 'wav';
                } else if (format === 'audio-mp3') {
                    mimeType = 'audio/webm';
                    extension = 'mp3';
                } else {
                    mimeType = 'audio/webm;codecs=opus'; 
                    extension = 'webm';
                }
            }

            if (!MediaRecorder.isTypeSupported(mimeType)) {
                mimeType = format.includes('video') || format === 'gif' ? 'video/webm' : 'audio/webm';
            }

            const recorder = new MediaRecorder(finalStream, { mimeType: mimeType });
            const chunks = [];
            
            recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
            
            recorder.onstop = () => {
                if (!State.cancelExport) {
                    const blob = new Blob(chunks, { type: mimeType });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${((document.getElementById('projectName')||{}).value||'ReelEdit_Export').trim().replace(/[\\/:*?"<>|]+/g,'_')||'ReelEdit_Export'}.${extension}`;
                    a.click();
                    URL.revokeObjectURL(url);
                }
                
                State.isExporting = false;
                State.exportResolution = 1920;
                if (State.speakerNode) State.speakerNode.gain.value = 1;
                closeExportModal();
                stopMedia();
            };

            State.lastRenderTime = performance.now();
            updatePlayhead();
            
            if (State.speakerNode) State.speakerNode.gain.value = 0;
            
            State.clips.forEach(clip => {
                const el = clip.audioEl || clip.videoEl;
                if (el && clip.start < endTime && (clip.start + clip.duration) > startTime) {
                    buildAudioGraph(clip);
                    applyAudioEffects(clip);
                    
                    const offset = Math.max(0, startTime - clip.start);
                    el.currentTime = clip.sourceOffset + offset;
                    
                    if (startTime >= clip.start) {
                        const p = el.play();
                        if (p !== undefined) { clip.playPromise = p; p.catch(e=>{}); }
                    }
                }
            });

            recorder.start();
            
            function exportLoop(now) {
                if (!State.isExporting) return;

                if (State.cancelExport) {
                    recorder.stop();
                    return;
                }

                const dt = (now - State.lastRenderTime) / 1000;
                State.lastRenderTime = now;
                State.currentTime += dt;

                State.clips.forEach(clip => {
                    const el = clip.audioEl || clip.videoEl;
                    if (el) {
                        // Start media if playhead reaches its start
                        if (State.currentTime >= clip.start && (State.currentTime - dt) < clip.start) {
                            el.currentTime = clip.sourceOffset;
                            const p = el.play();
                            if (p !== undefined) { clip.playPromise = p; p.catch(e=>{}); }
                        }
                        // Stop media if playhead passes it
                        if (State.currentTime > clip.start + clip.duration) {
                            if (!el.paused) {
                                if (clip.playPromise) { clip.playPromise.then(() => el.pause()).catch(()=>{}); }
                                else { el.pause(); }
                            }
                        }
                    }
                });

                if (exportCanvas && exportCtx) {
                    drawCanvas(exportCtx, exportW, exportH);
                } else {
                    drawCanvas();
                }

                const durationRange = endTime - startTime;
                const elapsed = State.currentTime - startTime;
                const progress = Math.min(100, Math.max(0, Math.round((elapsed / durationRange) * 100)));
                
                document.getElementById('exportProgressBar').style.width = `${progress}%`;
                document.getElementById('exportProgressText').textContent = `${progress}%`;

                if (State.currentTime >= endTime) {
                    recorder.stop();
                } else {
                    requestAnimationFrame(exportLoop);
                }
            }
            requestAnimationFrame(exportLoop);
        }


        updatePropertiesPanel();
        init();

function dockSide(a){return a.classList.contains('border-l')||a.classList.contains('border-r')}
function relayout(){setTimeout(function(){try{updateTimelineWidth();drawRuler();resizeCanvas()}catch(e){}window.dispatchEvent(new Event('resize'))},330)}
function setRC(on,save){var a=document.getElementById('propertiesSidebar');if(!a)return;a.classList.add('ranim');a.classList.toggle('rc',!!on);
  if(save!==false){try{localStorage.setItem('reelEditRail',on?'1':'0')}catch(e){}}
  setTimeout(function(){a.classList.remove('ranim')},350);relayout()}
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmt(d){d=Math.max(0,d||0);var m=Math.floor(d/60),s=Math.floor(d%60);return m+':'+('0'+s).slice(-2)}
function items(){var seen={},out=[];(State.clips||[]).forEach(function(c){if(TYPES[c.type]&&c.fileUrl){var k=c.fileUrl;if(!seen[k]){seen[k]={clip:c,n:0,ids:[]};out.push(seen[k])}seen[k].n++;seen[k].ids.push(c.id)}});return out}
function render(force){
  var sc=document.getElementById('sidebarContent');if(!sc||State.sidebarTab!=='media')return;
  var list=items();var key=list.map(function(i){return i.ids.join(',')+i.clip.title}).join('|')+'|'+filt+'|'+q+'|'+(State.selectedClipId||'');
  if(!force&&key===sig&&sc.querySelector('.mt'))return;sig=key;
  var keep=q;var vis=list.filter(function(i){return(filt==='all'||i.clip.type===filt)&&(!q||String(i.clip.title||'').toLowerCase().indexOf(q.toLowerCase())>=0)});
  sc.className='flex flex-col w-full flex-1 min-h-0 overflow-y-auto';
  sc.innerHTML='<div class="mt"><div class="mt-top"><input class="mt-search" placeholder="Search media\u2026" value="'+esc(keep)+'">'+
   ['all','video','image','audio'].map(function(f){return'<button class="mt-chip'+(filt===f?' on':'')+'" data-f="'+f+'">'+(f==='all'?'All':LBL[f])+'</button>'}).join('')+'</div>'+
   (vis.length?'<div class="mt-grid">'+vis.map(function(i){var c=i.clip,th;
     if(c.type==='image')th='<img src="'+esc(c.fileUrl)+'" alt="">';else if(c.type==='video')th='<video src="'+esc(c.fileUrl)+'#t=0.1" muted preload="metadata"></video>';else th='<i data-lucide="music"></i>';
     return'<button class="mt-card'+(i.ids.indexOf(State.selectedClipId)>=0?' sel':'')+'" data-id="'+esc(c.id)+'" title="'+esc(c.title)+'"><span class="mt-badge">'+LBL[c.type]+'</span><div class="mt-th">'+th+'</div><div class="mt-meta"><b>'+esc(c.title||'Untitled')+'</b><span>'+fmt(c.duration)+(i.n>1?' \u00b7 used '+i.n+'\u00d7':'')+'</span></div></button>'}).join('')+'</div>':
   '<div class="mt-drop" id="mtDrop">'+(list.length?'No media matches.':'No media yet. Drop files here or import.')+'</div>')+
   '<div class="mt-top"><button class="mt-btn" id="mtImport">Import media</button></div></div>';
  var inp=sc.querySelector('.mt-search');inp.addEventListener('input',function(){q=inp.value;var p=inp.selectionStart;render(true);var n=sc.querySelector('.mt-search');n.focus();n.setSelectionRange(p,p)});
  sc.querySelectorAll('.mt-chip').forEach(function(b){b.addEventListener('click',function(){filt=b.dataset.f;render(true)})});
  sc.querySelectorAll('.mt-card').forEach(function(b){b.addEventListener('click',function(){var c=State.clips.find(function(x){return x.id===b.dataset.id});if(!c)return;State.selectedClipId=c.id;State.currentTime=c.start;try{updatePropertiesPanel();renderClips();drawCanvas()}catch(e){}render(true)})});
  var imp=sc.querySelector('#mtImport');if(imp)imp.addEventListener('click',function(){var m=document.getElementById('mediaInput');if(m)m.click()});
  var root=sc.querySelector('.mt');['dragover','dragenter'].forEach(function(ev){root.addEventListener(ev,function(e){e.preventDefault();root.classList.add('over')})});
  root.addEventListener('dragleave',function(){root.classList.remove('over')});
  root.addEventListener('drop',function(e){e.preventDefault();root.classList.remove('over');var m=document.getElementById('mediaInput');if(m&&e.dataTransfer&&e.dataTransfer.files.length){m.files=e.dataTransfer.files;m.dispatchEvent(new Event('change',{bubbles:true}))}});
  if(window.lucide)lucide.createIcons();
}
function boot(){
  var rail=document.getElementById('sbRail');if(!rail||document.getElementById('tabMedia'))return;
  // Media tab button (same pattern as other tabs, placed after Properties)
  var mb=document.createElement('button');mb.id='tabMedia';mb.type='button';mb.title='Media';
  mb.innerHTML='<i data-lucide="film"></i><span class="lbl">Media</span>';
  mb.addEventListener('click',function(){setSidebarTab('media')});
  var first=rail.querySelector('#tabProperties');rail.insertBefore(mb,first?first.nextSibling:rail.firstChild);
  // tab labels
  var ren={tabAudioLib:'Audio'};
  // collapse button
  var cb=document.createElement('button');cb.id='sbCollapse';cb.type='button';cb.title='Collapse panel';cb.innerHTML='<i data-lucide="chevrons-left"></i>';
  cb.addEventListener('click',function(){var a=document.getElementById('propertiesSidebar');setRC(!a.classList.contains('rc'))});
  rail.appendChild(cb);
  // clicking any tab while collapsed expands
  rail.addEventListener('click',function(e){var b=e.target.closest('button');var a=document.getElementById('propertiesSidebar');if(b&&b.id!=='sbCollapse'&&!b.closest('#sbMoreWrap')&&a.classList.contains('rc'))setRC(false)},true);
  // route sidebar render for Media tab
  var u=window.updateSidebarPanel;if(typeof u==='function'&&!u.__m){var w=function(){if(State.sidebarTab==='media'){render(false);return}return u.apply(this,arguments)};w.__m=1;window.updateSidebarPanel=w}
  var st=window.setSidebarTab;if(typeof st==='function'&&!st.__m){var w2=function(t){var r=st.apply(this,arguments);var m=document.getElementById('tabMedia');if(m)m.classList.toggle('on',t==='media');var tt=document.getElementById('sbTitle');if(tt&&t==='media')tt.textContent='Media';if(t==='media')sig='';return r};w2.__m=1;window.setSidebarTab=w2}
  // keep media list fresh while open
  timer=setInterval(function(){if(State.sidebarTab==='media')render(false)},1000);
  try{if(localStorage.getItem('reelEditRail')==='1')setRC(true,false)}catch(e){}
  if(window.lucide)lucide.createIcons();
}
document.readyState==='loading'?document.addEventListener('DOMContentLoaded',function(){setTimeout(boot,0)}):setTimeout(boot,0);
})();
</script>
</body>
</html>
