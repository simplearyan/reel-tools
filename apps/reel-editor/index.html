                    const imported = JSON.parse(e.target.result);
                    if (!Array.isArray(imported)) {
                        alert("Invalid presets file format.");
                        return;
                    }
                    const current = loadCustomPresets();
                    let importedCount = 0;
                    imported.forEach(p => {

                    updateSidebarPanel();

        window.addPresetToTimeline = function(presetId) {
            const preset = DEFAULT_PRESETS.find(p => p.id === presetId) || loadCustomPresets().find(p => p.id === presetId);
            if (!preset) return;

            const startTime = State.currentTime;
            const duration = 5;
            const trackType = (preset.type === 'audio') ? 'audio' : 'video';
            const targetTrackId = getAvailableTrack(trackType, startTime, duration);
            const targetTrack = State.tracks.find(t => t.id === targetTrackId);
            const clipColor = targetTrack ? (targetTrack.colorIndex + 4) % PALETTES.length : 0;

            const newClip = {
                id: 'c_' + Date.now() + Math.random().toString(36).substr(2, 5),
                sceneId: State.activeSceneId || null,
                trackId: targetTrackId,
                colorIndex: clipColor,
                type: preset.type,
                title: preset.name,
                start: startTime,
                duration: duration,
                sourceOffset: 0,
                maxDuration: 3600,
                effects: JSON.parse(JSON.stringify(preset.effects))
            };

            if (preset.keyframes) {
                newClip.keyframes = JSON.parse(JSON.stringify(preset.keyframes));
            }

            if (preset.type === 'text') {
                newClip.text = preset.text || "PRESET TEXT";
            }
            if (preset.type === 'shape') {
                newClip.shapeType = preset.shapeType || 'rect';
            }
            if (preset.isPlaceholder) {
                newClip.isPlaceholder = true;
            }

            State.clips.push(newClip);
            State.selectedClipId = newClip.id;
            State.multiSelectedClipIds = [newClip.id];

            if (startTime + duration > State.duration) {
                State.duration = Math.ceil(startTime + duration + 10);
                updateTimelineWidth();
            }

            calcOverlaps();
            renderClips();
            drawCanvas();
            updateSidebarPanel();
        };

        window.applyPresetToSelected = function(presetId) {
            if (!State.selectedClipId) return;
            const clip = State.clips.find(c => c.id === State.selectedClipId);
            if (!clip) return;
            const preset = DEFAULT_PRESETS.find(p => p.id === presetId) || loadCustomPresets().find(p => p.id === presetId);
            if (!preset) return;

            if (preset.category === 'Keyframe Path') {
                const isPresetVisual = ['image', 'video', 'text', 'shape', 'scene'].includes(preset.type);
                const isClipVisual = ['image', 'video', 'text', 'shape', 'scene'].includes(clip.type);
                if (isPresetVisual && !isClipVisual) {
                    alert("Cannot apply a visual keyframe path to an audio track.");
                    return;
                }
                if (!isPresetVisual && isClipVisual) {
                    alert("Cannot apply an audio keyframe path to a visual element.");
                    return;
                }
                
                clip.keyframes = JSON.parse(JSON.stringify(preset.keyframes));
                drawCanvas();
                if (clip.audioNodes) applyAudioEffects(clip);
                renderClips();
                updateSidebarPanel();
                return;
            }

            if (clip.type !== preset.type) {
                alert(`Cannot apply preset: Selected clip is of type "${clip.type}", but preset is for "${preset.type}".`);
                return;
            }

            clip.effects = JSON.parse(JSON.stringify(preset.effects));
            if (preset.keyframes) {
                clip.keyframes = JSON.parse(JSON.stringify(preset.keyframes));
            } else {
                delete clip.keyframes;
            }

            if (preset.type === 'text' && preset.text) {
                clip.text = preset.text;
            }
            if (preset.type === 'shape' && preset.shapeType) {
                clip.shapeType = preset.shapeType;
            }
            if (preset.isPlaceholder) {
                clip.isPlaceholder = true;
                delete clip.imageEl;
                delete clip.videoEl;
                delete clip.fileUrl;
            }

            drawCanvas();
            updateSidebarPanel();
        };

            if (clip.type === 'shape') {

                            <button onclick="saveKeyframePreset('${clip.id}')" class="bg-brand-500 hover:bg-brand-600 text-white px-2 py-0.5 rounded text-[9px] font-bold transition-all shadow-sm" title="Save keyframes as reusable preset">
                                Save Preset
                            </button>
                        </div>
                    </div>
                    
                    <div class="flex flex-col gap-2.5 max-h-[350px] overflow-y-auto pr-1">
            `;
            
            props.forEach(p => {
                const hasKeyframes = clip.keyframes && clip.keyframes[p.key] && clip.keyframes[p.key].length > 0;
                let activeKf = null;
                if (hasKeyframes) {
                    activeKf = clip.keyframes[p.key].find(kf => Math.abs(kf.time - localTime) < 0.05);
                }
                
                const activeVal = window.getInterpolatedValue(clip, p.key, p.def);
                const percent = ((activeVal - p.min) / (p.max - p.min)) * 100;
                
                html += `

                                ${activeVal.toFixed(p.step < 0.1 ? 2 : 0)}
                            </span>
                        </div>
                        
                        ${hasKeyframes ? `
                            <div class="flex items-center gap-2 mt-1">
                                <button onclick="toggleKeyframeAtPlayhead('${clip.id}', '${p.key}', ${activeVal})" 
                                        class="p-1 rounded shrink-0 transition-colors ${activeKf ? 'text-brand-500' : 'text-surface-300 hover:text-surface-500 dark:text-surface-600'}" 
                                        title="${activeKf ? 'Delete Keyframe' : 'Add Keyframe'}">
                                    <i data-lucide="diamond" class="w-3.5 h-3.5 ${activeKf ? 'fill-brand-500' : ''}"></i>
                                </button>
                                
                                <input type="range" 
                                       min="${p.min}" 
                                       max="${p.max}" 
                                       step="${p.step}" 
                                       value="${activeVal}" 
                                       class="flex-1 custom-slider"

                                />
                                
                                ${activeKf ? `
                                    <select onchange="adjustKeyframeEasing('${clip.id}', '${p.key}', ${clip.keyframes[p.key].indexOf(activeKf)}, this.value)" 
                                            class="text-[9px] font-bold py-0.5 px-1 border border-surface-200 dark:border-surface-700 rounded bg-white dark:bg-surface-800 text-surface-700 dark:text-surface-300 focus:outline-none cursor-pointer">
                                        <option value="linear" ${activeKf.ease === 'linear' ? 'selected' : ''}>Linear</option>
                                        <option value="easeIn" ${activeKf.ease === 'easeIn' ? 'selected' : ''}>Ease In</option>
                                        <option value="easeOut" ${activeKf.ease === 'easeOut' ? 'selected' : ''}>Ease Out</option>
                                        <option value="easeInOut" ${activeKf.ease === 'easeInOut' ? 'selected' : ''}>Ease I/O</option>
                                        <option value="static" ${activeKf.ease === 'static' ? 'selected' : ''}>Static (Hold)</option>
                                    </select>
                                ` : `
                                    <span class="text-[8px] font-bold text-surface-400 dark:text-surface-500 uppercase tracking-widest shrink-0 w-[55px] text-center">Interpolated</span>

                            <div class="flex items-center gap-2 mt-1">
                                <div class="w-5.5 h-5.5 shrink-0"></div>
                                <input type="range" 
                                       min="${p.min}" 
                                       max="${p.max}" 
                                       step="${p.step}" 
                                       value="${activeVal}" 
                                       class="flex-1 custom-slider"
                                       style="background: linear-gradient(to right, ${sliderFill} ${percent}%, ${sliderBg} ${percent}%)"
                                       oninput="setClipEffect('${clip.id}', '${p.key}', this.value); updateSidebarPanel(); drawCanvas();"
                                />

                            </div>
                        `}
                    </div>
                `;
            });
            
            html += `
                    </div>
                </div>
            `;
            return html;
        };

        window.togglePropertyKeyframing = function(clipId, propertyKey, defaultValue) {
            const clip = State.clips.find(c => c.id === clipId);
            if (!clip) return;
            
            if (!clip.keyframes) clip.keyframes = {};
            
            const hasKeyframes = clip.keyframes[propertyKey] && clip.keyframes[propertyKey].length > 0;
            if (hasKeyframes) {
                if (confirm(`Disable keyframing for "${propertyKey}"? This will delete all existing keyframes.`)) {
                    delete clip.keyframes[propertyKey];
                }
            } else {
                clip.keyframes[propertyKey] = [];
                const currentVal = clip.effects && clip.effects[propertyKey] !== undefined ? parseFloat(clip.effects[propertyKey]) : defaultValue;
                clip.keyframes[propertyKey].push({
                    time: 0,
                    value: currentVal,
                    ease: 'linear'
                });
            }
            updateSidebarPanel();
            renderClips();
            drawCanvas();
        };

        window.toggleKeyframeAtPlayhead = function(clipId, propertyKey, currentValue) {
            const clip = State.clips.find(c => c.id === clipId);
            if (!clip || !clip.keyframes || !clip.keyframes[propertyKey]) return;
            
            const localTime = Math.max(0, Math.min(clip.duration, State.currentTime - clip.start));
            const existingIdx = clip.keyframes[propertyKey].findIndex(kf => Math.abs(kf.time - localTime) < 0.05);
            if (existingIdx !== -1) {
                clip.keyframes[propertyKey].splice(existingIdx, 1);
            } else {
                clip.keyframes[propertyKey].push({
                    time: localTime,
                    value: currentValue,
                    ease: 'linear'
                });
            }
            updateSidebarPanel();
            renderClips();
            drawCanvas();
        };

        window.adjustKeyframeValue = function(clipId, propertyKey, newValue) {
            const clip = State.clips.find(c => c.id === clipId);
            if (!clip || !clip.keyframes || !clip.keyframes[propertyKey]) return;
            
            const localTime = Math.max(0, Math.min(clip.duration, State.currentTime - clip.start));
            const val = parseFloat(newValue);
            
            const existing = clip.keyframes[propertyKey].find(kf => Math.abs(kf.time - localTime) < 0.05);
            if (existing) {
                existing.value = val;
            } else {
                clip.keyframes[propertyKey].push({
                    time: localTime,
                    value: val,
                    ease: 'linear'
                });
            }
            
            if (!clip.effects) clip.effects = {};
            clip.effects[propertyKey] = val;
            
            drawCanvas();
            if (clip.audioNodes) applyAudioEffects(clip);
            
            const labelBtn = document.querySelector(`[onclick*="togglePropertyKeyframing('${clipId}', '${propertyKey}'"]`);
            if (labelBtn) {
                const label = labelBtn.closest('div').nextElementSibling;
                if (label) {
                    label.textContent = val.toFixed(newValue.includes('.') ? 2 : 0);
                }
            }
            
            // Adjust linear-gradient progress color of the range input dynamically
            const input = event.target;
            const min = parseFloat(input.min || 0);
            const max = parseFloat(input.max || 100);
            const pct = ((val - min) / (max - min)) * 100;
            const sliderFill = State.darkMode ? '#6366f1' : '#4f46e5';
            const sliderBg = State.darkMode ? '#374151' : '#e5e7eb';
            input.style.background = `linear-gradient(to right, ${sliderFill} ${pct}%, ${sliderBg} ${pct}%)`;
            
            renderClips();
        };

        window.adjustKeyframeEasing = function(clipId, propertyKey, index, newEase) {
            const clip = State.clips.find(c => c.id === clipId);
            if (!clip || !clip.keyframes || !clip.keyframes[propertyKey] || !clip.keyframes[propertyKey][index]) return;
            
            clip.keyframes[propertyKey][index].ease = newEase;
            drawCanvas();
            if (clip.audioNodes) applyAudioEffects(clip);
        };

        window.saveKeyframePreset = function(clipId) {
            const clip = State.clips.find(c => c.id === clipId);
            if (!clip || !clip.keyframes) {
                alert("No keyframes found to save!");
                return;
            }
            
            const lanes = Object.keys(clip.keyframes).filter(k => clip.keyframes[k] && clip.keyframes[k].length > 0);
            if (lanes.length === 0) {
                alert("No keyframes found to save!");
                return;
            }
            
            const name = prompt("Enter a name for this Custom Keyframe Preset:", "Smooth Spin Intro");
            if (!name) return;
            
            const preset = {
                id: 'preset_kf_' + Date.now() + Math.random().toString(36).substr(2, 5),
                name: name,
                type: clip.type,
                category: 'Keyframe Path',
                keyframes: JSON.parse(JSON.stringify(clip.keyframes)),
                effects: {}
            };
            
            const presets = loadCustomPresets();
            presets.push(preset);
            saveCustomPresets(presets);
            
            alert(`Keyframe preset "${name}" saved successfully! You can find it in the Presets tab.`);
            updateSidebarPanel();
        };

        function getLinkedClipsGroup(clip) {
            const group = new Set();
            const queue = [clip.id];
            while (queue.length > 0) {
                const id = queue.shift();
                if (!group.has(id)) {
                    group.add(id);
                    const c = State.clips.find(x => x.id === id);
                    if (c && c.linkedClipIds) {
                        c.linkedClipIds.forEach(linkedId => {
                            queue.push(linkedId);
                        });
                    }
                }
            }
            return Array.from(group).map(id => State.clips.find(x => x.id === id)).filter(Boolean);
        }

        window.linkSelectedClips = function() {
            const selectedIds = State.multiSelectedClipIds;
            if (selectedIds.length < 2) return;
            
            selectedIds.forEach(id => {
                const clip = State.clips.find(c => c.id === id);
                if (clip) {
                    if (!clip.linkedClipIds) clip.linkedClipIds = [];
                    selectedIds.forEach(otherId => {
                        if (otherId !== id && !clip.linkedClipIds.includes(otherId)) {
                            clip.linkedClipIds.push(otherId);
                        }
                    });
                }
            });
            renderClips();
        };

        window.unlinkClip = function(clipId) {
            const clip = State.clips.find(c => c.id === clipId);
            if (!clip || !clip.linkedClipIds) return;
            
            clip.linkedClipIds.forEach(otherId => {
                const other = State.clips.find(c => c.id === otherId);
                if (other && other.linkedClipIds) {
                    other.linkedClipIds = other.linkedClipIds.filter(id => id !== clipId);
                }
            });
            clip.linkedClipIds = [];
            renderClips();
        };

        window.unlinkGroup = function(clipId) {
            const clip = State.clips.find(c => c.id === clipId);
            if (!clip) return;
            
            const group = getLinkedClipsGroup(clip);
            group.forEach(c => {
                c.linkedClipIds = [];
            });
            renderClips();
        };

        window.selectLinkedGroup = function(clipId) {
            const clip = State.clips.find(c => c.id === clipId);
            if (!clip) return;
            
            const group = getLinkedClipsGroup(clip);
            State.multiSelectedClipIds = group.map(c => c.id);
            State.selectedClipId = clipId;
            renderClips();
            updatePropertiesPanel();
        };

        window.duplicateClipAction = function(clipId) {
            const clip = State.clips.find(c => c.id === clipId);
            if (!clip) return;
            const dup = duplicateClip(clip);
            State.clips.push(dup);
            State.selectedClipId = dup.id;
            State.multiSelectedClipIds = [dup.id];
            calcOverlaps();
            renderClips();
            updatePropertiesPanel();
            drawCanvas();
        };

        window.deleteClipAction = function(clipId) {
            const idx = State.clips.findIndex(c => c.id === clipId);
            if (idx !== -1) {
                window.unlinkClip(clipId);
                State.clips.splice(idx, 1);
                if (State.selectedClipId === clipId) {
                    State.selectedClipId = null;
                }
                State.multiSelectedClipIds = State.multiSelectedClipIds.filter(id => id !== clipId);
                calcOverlaps();
                renderClips();
                updatePropertiesPanel();
                drawCanvas();
            }
        };

        window.showClipContextMenu = function(clip, x, y) {
            let menu = document.getElementById('clipContextMenu');
            if (!menu) {
                menu = document.createElement('div');
                menu.id = 'clipContextMenu';
                menu.className = 'absolute bg-white dark:bg-surface-800 border border-surface-200 dark:border-surface-700 shadow-xl rounded-lg py-1.5 z-[1000] min-w-[160px] text-xs font-semibold text-surface-800 dark:text-surface-200';
                document.body.appendChild(menu);
            }
            
            menu.style.left = `${x}px`;
            menu.style.top = `${y}px`;
            menu.style.display = 'block';
            
            const isLinked = clip.linkedClipIds && clip.linkedClipIds.length > 0;
            const hasMulti = State.multiSelectedClipIds && State.multiSelectedClipIds.length > 1;
            
            let itemsHtml = '';
            
            if (hasMulti) {
                itemsHtml += `
                    <button onclick="linkSelectedClips(); hideClipContextMenu();" class="w-full text-left px-3 py-2 hover:bg-surface-100 dark:hover:bg-surface-700 flex items-center gap-2">
                        <i data-lucide="link" class="w-3.5 h-3.5 text-brand-500"></i> Link Selected Clips
                    </button>
                `;
            }
            
            if (isLinked) {
                itemsHtml += `
                    <button onclick="unlinkClip('${clip.id}'); hideClipContextMenu();" class="w-full text-left px-3 py-2 hover:bg-surface-100 dark:hover:bg-surface-700 flex items-center gap-2 text-red-500 dark:text-red-400">
                        <i data-lucide="link-2" class="w-3.5 h-3.5"></i> Unlink Clip
                    </button>
                    <button onclick="unlinkGroup('${clip.id}'); hideClipContextMenu();" class="w-full text-left px-3 py-2 hover:bg-surface-100 dark:hover:bg-surface-700 flex items-center gap-2 text-red-500 dark:text-red-400">
                        <i data-lucide="unlink" class="w-3.5 h-3.5"></i> Unlink Group
                    </button>
                    <button onclick="selectLinkedGroup('${clip.id}'); hideClipContextMenu();" class="w-full text-left px-3 py-2 hover:bg-surface-100 dark:hover:bg-surface-700 flex items-center gap-2">
                        <i data-lucide="scan" class="w-3.5 h-3.5 text-brand-500"></i> Select Linked Group
                    </button>
                `;
            }
            
            itemsHtml += `
                <div class="border-t border-surface-150 dark:border-surface-750 my-1"></div>
                <button onclick="duplicateClipAction('${clip.id}'); hideClipContextMenu();" class="w-full text-left px-3 py-2 hover:bg-surface-100 dark:hover:bg-surface-700 flex items-center gap-2">
                    <i data-lucide="copy" class="w-3.5 h-3.5 text-surface-500"></i> Duplicate Clip
                </button>
                <button onclick="deleteClipAction('${clip.id}'); hideClipContextMenu();" class="w-full text-left px-3 py-2 hover:bg-surface-100 dark:hover:bg-surface-700 flex items-center gap-2 text-red-500">
                    <i data-lucide="trash-2" class="w-3.5 h-3.5 flex-shrink-0"></i> Delete Clip
                </button>
            `;
            
            menu.innerHTML = itemsHtml;
            lucide.createIcons({ scope: menu });
            
            const outsideClickListener = (e) => {
                if (!menu.contains(e.target)) {
                    hideClipContextMenu();
                    document.removeEventListener('click', outsideClickListener);
                }
            };
            setTimeout(() => {
                document.addEventListener('click', outsideClickListener);
            }, 50);
        };

        window.hideClipContextMenu = function() {
            const menu = document.getElementById('clipContextMenu');
            if (menu) menu.style.display = 'none';
        };

        window.mathImageCache = {};

        window.insertTexTemplate = function(clipId, templateStr) {
            const clip = State.clips.find(c => c.id === clipId);
            if (!clip) return;
            
            const textarea = document.querySelector(`textarea[oninput*="${clipId}"]`);
            if (textarea) {
                const start = textarea.selectionStart;
                const end = textarea.selectionEnd;
                const text = textarea.value;
                const before = text.substring(0, start);
                const after = text.substring(end);
                
                textarea.value = before + templateStr + after;
                clip.text = textarea.value;
                
                // Keep cursor focus and update selection position
                textarea.focus();
                textarea.selectionStart = textarea.selectionEnd = start + templateStr.length;
            } else {
                clip.text = (clip.text || '') + templateStr;
            }
            drawCanvas();
            renderClips();
        };

        window.replaceClipSource = async function(clipId, files) {
            if (!files || !files.length) return;
            const clip = State.clips.find(c => c.id === clipId);
            if (!clip) return;

            const file = files[0];
            const objectUrl = URL.createObjectURL(file);
            clip.fileName = file.name;

            if (clip.type === 'image') {
                const img = new Image();
                img.src = objectUrl;
                await new Promise(r => img.onload = r);
                clip.imageEl = img;
                clip.fileUrl = objectUrl;
                clip.isPlaceholder = false;
                clip.title = file.name;
            } else if (clip.type === 'video') {
                const v = document.createElement('video');
                v.src = objectUrl;
                v.crossOrigin = "anonymous";
                v.muted = true;
                await new Promise((resolve) => {
                    v.onloadedmetadata = () => {
                        clip.maxDuration = v.duration;
                        resolve();
                    };
                    v.onerror = resolve;
                });
                v.load();
                clip.videoEl = v;
                clip.fileUrl = objectUrl;
                clip.isPlaceholder = false;
                clip.title = file.name;
            }

            calcOverlaps();
            renderClips();
            drawCanvas();
            updateSidebarPanel();
        };

                `;

            const volPercent = Math.round((activeTrack.volume !== undefined ? activeTrack.volume : 1.0) * 100);
            const vol = activeTrack.volume !== undefined ? activeTrack.volume : 1.0;
            const autoDuck = activeTrack.autoDuck || false;
            const volumeDuck = activeTrack.volumeDuck || false;
            const reverbEnable = activeTrack.reverbEnable || false;
            const reverb = activeTrack.reverb !== undefined ? activeTrack.reverb : 0.5;
            
            html += `
                    </div>
                    
                    <!-- Detail (Right) -->
                    <div class="flex-1 flex flex-col p-4 overflow-y-auto min-w-0">
                        <div class="flex items-center justify-between mb-4">

        async function handleAudioLibraryImport(event) {
            const files = event.target.files;
            if (!files.length) return;
            
            if (!audioCtx) audioCtx = new AudioContext();
            
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const arrayBuffer = await file.arrayBuffer();
                const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                
                const channelData = audioBuffer.getChannelData(0);
                const step = Math.ceil(channelData.length / 200);
                const peaks = [];
                let globalMax = 0;
                for (let j = 0; j < 200; j++) {
                    let sum = 0;
                    for (let k = 0; k < step; k++) {
                        const datum = channelData[(j * step) + k] || 0;
                        sum += Math.abs(datum);
                    }
                    const avg = sum / step;
                    peaks.push(avg);
                    if (avg > globalMax) globalMax = avg;
                }
                
                if (globalMax > 0) {
                    for (let j = 0; j < 200; j++) {
                        peaks[j] = peaks[j] / globalMax;
                    }
                }
                
                State.audioLibrary.push({
                    id: 'lib_' + Math.random().toString(36).substr(2, 9),
                    name: file.name,
                    file: file,
                    buffer: audioBuffer,
                    duration: audioBuffer.duration,
                    peaks: peaks,
                    inPoint: 0,
                    outPoint: audioBuffer.duration,
                    isPlaying: false
                });
            }
            
            updateSidebarPanel();
        }

        function toggleAudioLibAutoplay() {
            State.audioLibAutoplay = !State.audioLibAutoplay;
            updateSidebarPanel();
        }

        function selectAudioLibItem(id) {

        function drawAudioLibWaveform() {
            const canvas = document.getElementById('audioLibWaveform');
            if (!canvas) return;
            
            const audio = State.audioLibrary.find(a => a.id === State.selectedAudioLibId);
            if (!audio) return;
            
            const ctx = canvas.getContext('2d');
            const dpr = window.devicePixelRatio || 1;
            canvas.width = canvas.clientWidth * dpr;
            canvas.height = canvas.clientHeight * dpr;
            ctx.scale(dpr, dpr);
            
            const w = canvas.clientWidth;
            const h = canvas.clientHeight;
            
            ctx.clearRect(0, 0, w, h);
            
            const isDarkMode = document.documentElement.classList.contains('dark');
            const activeColor = isDarkMode ? '#818cf8' : '#6366f1';
            const inactiveColor = isDarkMode ? '#374151' : '#cbd5e1';
            
            const peaks = audio.peaks;
            const inPx = (audio.inPoint / audio.duration) * w;
            const outPx = (audio.outPoint / audio.duration) * w;
            
            const drawBars = () => {
                const totalWidth = w / peaks.length;
                const barWidth = Math.max(1.5, totalWidth * 0.6);
                ctx.lineWidth = barWidth;
                ctx.lineCap = 'round';
                
                ctx.beginPath();
                for (let i = 0; i < peaks.length; i++) {
                    const x = i * totalWidth + totalWidth / 2;
                    let peakH = peaks[i] * h * 0.85;
                    if (peakH < barWidth) peakH = barWidth;
                    
                    ctx.moveTo(x, (h - peakH) / 2 + barWidth / 2);
                    ctx.lineTo(x, (h + peakH) / 2 - barWidth / 2);
                }
            };
            
            ctx.strokeStyle = inactiveColor;
            drawBars();
            ctx.stroke();
            
            ctx.save();
            ctx.beginPath();
            ctx.rect(inPx, 0, outPx - inPx, h);
            ctx.clip();
            
            ctx.strokeStyle = activeColor;
            drawBars();
            ctx.stroke();
            
            ctx.restore();
        }

        function updateAudioLibHandles() {
            const container = document.getElementById('audioLibWaveformContainer');
            if (!container) return;
            const audio = State.audioLibrary.find(a => a.id === State.selectedAudioLibId);
            if (!audio) return;
            
            const w = container.clientWidth;
            const leftPx = (audio.inPoint / audio.duration) * w;
            const rightPx = (audio.outPoint / audio.duration) * w;
            
            document.getElementById('audioLibHandleL').style.left = `${leftPx}px`;
            document.getElementById('audioLibHandleR').style.left = `${rightPx}px`;
            
            const overlay = document.getElementById('audioLibTrimOverlay');
            overlay.style.left = `${leftPx}px`;
            overlay.style.width = `${rightPx - leftPx}px`;
        }

        function startAudioLibTrim(e, side) {
            e.preventDefault();
            e.stopPropagation();
            if (e.button !== 0) return; // Only respond to left mouse button
            
            const container = document.getElementById('audioLibWaveformContainer');
            const audio = State.audioLibrary.find(a => a.id === State.selectedAudioLibId);
            if (!container || !audio) return;
            
            const w = container.clientWidth;
            const rect = container.getBoundingClientRect();
            
            let startPx = e.clientX - rect.left;
            startPx = Math.max(0, Math.min(startPx, w));
            let startTime = (startPx / w) * audio.duration;
            
            if (side === 'new') {
                audio.inPoint = startTime;
                audio.outPoint = Math.min(audio.duration, startTime + 0.1);
                updateAudioLibHandles();
            }
            
            function onMove(me) {
                let px = me.clientX - rect.left;
                px = Math.max(0, Math.min(px, w));
                let time = (px / w) * audio.duration;
                
                if (side === 'left') {
                    time = Math.min(time, audio.outPoint - 0.1);
                    audio.inPoint = time;
                } else if (side === 'right') {
                    time = Math.max(time, audio.inPoint + 0.1);
                    audio.outPoint = time;
                } else if (side === 'new') {
                    if (time >= startTime) {
                        audio.inPoint = startTime;
                        audio.outPoint = Math.max(startTime + 0.1, time);
                    } else {
                        audio.outPoint = startTime;
                        audio.inPoint = Math.min(startTime - 0.1, time);
                    }
                }
                updateAudioLibHandles();
            }
            
            function onUp() {
                window.removeEventListener('mousemove', onMove);
                window.removeEventListener('mouseup', onUp);
            }
            
            window.addEventListener('mousemove', onMove);
            window.addEventListener('mouseup', onUp);
        }

        function toggleAudioLibPlayback() {
            const audio = State.audioLibrary.find(a => a.id === State.selectedAudioLibId);
            if (!audio) return;
            
            if (audio.isPlaying) {
                stopAudioLibPlayback();
            } else {
                playAudioLibItem(audio);
            }
        }

        function playAudioLibItem(audio) {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            stopAudioLibPlayback();
            
            audioLibSource = audioCtx.createBufferSource();
            audioLibSource.buffer = audio.buffer;
            audioLibSource.connect(audioCtx.destination);
            
            const durationToPlay = audio.outPoint - audio.inPoint;
            audioLibSource.start(0, audio.inPoint, durationToPlay);
            
            audio.isPlaying = true;
            audioLibStartTime = audioCtx.currentTime - audio.inPoint;
            updateSidebarPanel();
            
            const playhead = document.getElementById('audioLibPlayhead');
            const container = document.getElementById('audioLibWaveformContainer');
            
            if (playhead && container) {
                playhead.classList.remove('hidden');
                const w = container.clientWidth;
                
                function loop() {
                    if (!audio.isPlaying) return;
                    let currentPlayTime = audioCtx.currentTime - audioLibStartTime;
                    if (currentPlayTime >= audio.outPoint) {
                        stopAudioLibPlayback();
                        return;
                    }
                    const px = (currentPlayTime / audio.duration) * w;
                    playhead.style.left = `${px}px`;
                    audioLibAnimationFrame = requestAnimationFrame(loop);
                }
                audioLibAnimationFrame = requestAnimationFrame(loop);
            }
            
            audioLibSource.onended = () => {
                if (audio.isPlaying) {
                    stopAudioLibPlayback();
                }
            };
        }

        function stopAudioLibPlayback() {
            const audio = State.audioLibrary.find(a => a.id === State.selectedAudioLibId);
            if (audio) {
                audio.isPlaying = false;
                updateSidebarPanel();
            }
            
            if (audioLibSource) {
                try { audioLibSource.stop(); } catch(e) {}
                audioLibSource = null;
            }
            if (audioLibAnimationFrame) {
                cancelAnimationFrame(audioLibAnimationFrame);
                audioLibAnimationFrame = null;
            }
            const playhead = document.getElementById('audioLibPlayhead');
            if (playhead) playhead.classList.add('hidden');
        }

        async function addAudioLibToTimeline() {
            const audio = State.audioLibrary.find(a => a.id === State.selectedAudioLibId);
            if (!audio) return;
            
            stopAudioLibPlayback();
            
            const trimmedDuration = audio.outPoint - audio.inPoint;
            
            let audioTargetTrackId = getAvailableTrack('audio', State.currentTime, trimmedDuration);
            let targetTrack = State.tracks.find(t => t.id === audioTargetTrackId);
            
            const audioEl = new Audio(URL.createObjectURL(audio.file));
            audioEl.crossOrigin = "anonymous";
            await new Promise((resolve) => {
                if (audioEl.readyState >= 1) resolve();
                else {
                    audioEl.addEventListener('loadedmetadata', resolve, { once: true });
                    audioEl.addEventListener('error', resolve, { once: true });
                }
            });
            
            const clip = {
                id: 'clip_' + Math.random().toString(36).substr(2, 9),
                type: 'audio',
                title: audio.name,
                duration: trimmedDuration,
                start: State.currentTime,
                sourceOffset: audio.inPoint,
                trackId: audioTargetTrackId,
                colorIndex: targetTrack ? targetTrack.colorIndex : 1,
                audioEl: audioEl,
                buffer: audio.buffer, // Add this for perfect Web Audio playback
                maxDuration: audio.duration,
                peaksPerSecond: 100,
                effects: { volume: 1, echo: 0.5, echoEnable: false, cartoon: 0.5, cartoonEnable: false, cinematic: 0.5, cinematicEnable: false, robot: 0.5, robotEnable: false, noiseRed: 0.5, noiseRedEnable: false }
            };
            
            const peaks = [];
            const peaksPerSecond = 100;
            const step = Math.floor(audio.buffer.sampleRate / peaksPerSecond);
            const data = audio.buffer.getChannelData(0);
            for (let i = 0; i < data.length; i += step) {
                let max = 0, min = 0;
                for (let j = 0; j < step && i + j < data.length; j++) {
                    const val = data[i + j];
                    if (val > max) max = val;
                    if (val < min) min = val;
                }
                peaks.push({ max, min });
            }
            clip.peaks = peaks;
            
            buildAudioGraph(clip);
            State.clips.push(clip);
            renderClips();
            drawCanvas();
        }

        // --- Quick Action Handlers ---
        function handleScaleUp() {
            if (!State.selectedClipId) return;
            const clip = State.clips.find(c => c.id === State.selectedClipId);
            if (!clip || !clip.effects) return;
            if (clip.type === 'audio') {
                let current = clip.effects.volume !== undefined ? clip.effects.volume : 1;
                setClipEffect(clip.id, 'volume', Math.min(2, current + 0.1));
            } else {
                let current = clip.effects.scale !== undefined ? clip.effects.scale : 1;
                setClipEffect(clip.id, 'scale', Math.min(3, current * 1.1));
            }
            updatePropertiesPanel();
        }
        function handleScaleDown() {
            if (!State.selectedClipId) return;
            const clip = State.clips.find(c => c.id === State.selectedClipId);
            if (!clip || !clip.effects) return;
            if (clip.type === 'audio') {
                let current = clip.effects.volume !== undefined ? clip.effects.volume : 1;
                setClipEffect(clip.id, 'volume', Math.max(0, current - 0.1));
            } else {
                let current = clip.effects.scale !== undefined ? clip.effects.scale : 1;
                setClipEffect(clip.id, 'scale', Math.max(0, current * 0.9));
            }
            updatePropertiesPanel();
        }
        function handleRotate(deg = 90) {
            if (!State.selectedClipId) return;
            const clip = State.clips.find(c => c.id === State.selectedClipId);
            if (!clip || !clip.effects) return;
            let current = clip.effects.rotate !== undefined ? clip.effects.rotate : 0;
            setClipEffect(clip.id, 'rotate', (current + deg) % 360);
            updatePropertiesPanel();
        }
        function handleFlipH() {
            if (!State.selectedClipId) return;
            const clip = State.clips.find(c => c.id === State.selectedClipId);
            if (!clip) return;
            if (!clip.effects) clip.effects = {};

            if (!State.selectedClipId) return;

            if (!clip) return;
            if (!clip.effects) clip.effects = {};
            clip.effects.flipV = !clip.effects.flipV;

        function handleCenterH() {
            if (!State.selectedClipId) return;
            const clip = State.clips.find(c => c.id === State.selectedClipId);
            if (!clip) return;
            if (!clip.effects) clip.effects = {};

        window.addTrack = (type) => {
            const currentSceneId = State.activeSceneId || null;
            const count = State.tracks.filter(t => t.type === type && (t.sceneId || null) === currentSceneId).length + 1;
            const newTrack = {
                id: type.charAt(0) + Date.now(),
                type: type,
                name: `${type === 'video' ? 'V' : 'A'}${count}`,
                height: 90, 
                colorIndex: State.tracks.length % PALETTES.length,
                muted: false,
                solo: false,
                volume: 1.0,
                sceneId: currentSceneId
            };
            if (type === 'video') {
                State.tracks.unshift(newTrack);
            } else {
                State.tracks.push(newTrack);
            }
            renderTrackHeaders();
            renderTracks();
            renderClips();
        };

        function getAvailableTrack(type, start, duration) {
            const currentSceneId = State.activeSceneId || null;
            for (const track of State.tracks.filter(t => t.type === type && (t.sceneId || null) === currentSceneId)) {
                const hasOverlap = State.clips.some(c => 
                    c.trackId === track.id && 
                    (start < c.start + c.duration && start + duration > c.start)
                );
                if (!hasOverlap) return track.id;
            }
            const count = State.tracks.filter(t => t.type === type && (t.sceneId || null) === currentSceneId).length + 1;
            const newTrack = {
                id: type.charAt(0) + Date.now(),
                type: type,
                name: `${type === 'video' ? 'V' : 'A'}${count}`,
                height: 90,
                colorIndex: State.tracks.length % PALETTES.length,
                muted: false,
                sceneId: currentSceneId
            };
            if (type === 'video') {
                State.tracks.unshift(newTrack);
            } else {
                State.tracks.push(newTrack);
            }
            renderTrackHeaders();
            renderTracks();
            return newTrack.id;
        }

                State.clips.filter(c => c.trackId === trackId).forEach(c => {

        window.toggleLock = (trackId) => {
            const track = State.tracks.find(t => t.id === trackId);
            if (track) {
                track.locked = !track.locked;
                if (track.locked) {
                    State.multiSelectedClipIds = State.multiSelectedClipIds.filter(id => {
                        const c = State.clips.find(x => x.id === id);
                        return c && c.trackId !== trackId;
                    });
                    if (State.selectedClipId) {
                        const sel = State.clips.find(x => x.id === State.selectedClipId);
                        if (sel && sel.trackId === trackId) {
                            State.selectedClipId = State.multiSelectedClipIds.length > 0 ? State.multiSelectedClipIds[0] : null;
                        }
                    }
                }
                renderTrackHeaders();
                renderTracks();
                renderClips();
                updatePropertiesPanel();
            }
        };

        window.deleteTrack = (trackId) => {
            const trackIdx = State.tracks.findIndex(t => t.id === trackId);
            if (trackIdx !== -1) {
                const track = State.tracks[trackIdx];
                const currentSceneId = State.activeSceneId || null;
                
                const clipsToDelete = State.clips.filter(c => c.trackId === trackId && (c.sceneId || null) === currentSceneId);
                clipsToDelete.forEach(c => {
                    if (c.audioEl) { 
                        if (c.playPromise) { c.playPromise.then(() => c.audioEl.pause()).catch(()=>{}); }
                        else { c.audioEl.pause(); }
                        c.audioEl.removeAttribute('src'); 
                    }
                    if (c.audioNodes) c.audioNodes.source.disconnect();
                });
                
                State.clips = State.clips.filter(c => !(c.trackId === trackId && (c.sceneId || null) === currentSceneId));
                
                const isUsedInOtherScenes = State.clips.some(c => c.trackId === trackId && (c.sceneId || null) !== currentSceneId);
                
                if (isUsedInOtherScenes) {
                    const firstOtherClip = State.clips.find(c => c.trackId === trackId && (c.sceneId || null) !== currentSceneId);
                    if (firstOtherClip) {
                        track.sceneId = firstOtherClip.sceneId || null;
                    }
                } else {
                    State.tracks.splice(trackIdx, 1);
                }
                
                State.multiSelectedClipIds = State.multiSelectedClipIds.filter(id => State.clips.some(c => c.id === id));
                if (State.selectedClipId && !State.clips.some(c => c.id === State.selectedClipId)) {
                    State.selectedClipId = State.multiSelectedClipIds.length > 0 ? State.multiSelectedClipIds[0] : null;
                }
                
                renderTrackHeaders();
                renderTracks();
                renderClips();
                updatePropertiesPanel();
                drawCanvas();
            }
        };

                        let duration = 5; 
                        let peaks = [];
                        let peaksPerSecond = 100; 
                        let audioEl = new Audio(objectUrl);
                        audioEl.crossOrigin = "anonymous";
                        
                        let decodedBuffer = null;
                        try {
                            const arrayBuffer = await file.arrayBuffer();
                            const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                            decodedBuffer = audioBuffer;
                            duration = audioBuffer.duration;
                            
                            const data = audioBuffer.getChannelData(0);
                            const step = Math.floor(audioBuffer.sampleRate / peaksPerSecond);
                            for (let i = 0; i < data.length; i += step) {
                                let max = 0, min = 0;
                                for (let j = 0; j < step && i + j < data.length; j++) {
                                    const val = data[i + j];
                                    if (val > max) max = val;
                                    if (val < min) min = val;

            btnImportFont.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>`;
            lucide.createIcons();

            const file = files[0];
            if (file.name.startsWith('._')) {
                alert("This file appears to be a macOS system metadata file, not a valid font file.");
                btnImportFont.innerHTML = `<i data-lucide="file-type" class="w-4 h-4"></i>`;
                lucide.createIcons();
                fontInput.value = '';
                return;
            }
            if (file.size > 2.5 * 1024 * 1024) {
                alert("Font file is too large (max 2.5MB). Please upload a smaller font file (Woff/Woff2 are highly recommended) to ensure it fits in browser storage.");
                btnImportFont.innerHTML = `<i data-lucide="file-type" class="w-4 h-4"></i>`;
                lucide.createIcons();
                fontInput.value = '';
                return;
            }

            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const dataUri = evt.target.result;
                    const name = file.name.replace(/\.[^/.]+$/, "");

                    if (!State.customFonts) {
                        State.customFonts = [];
                    }
                    const existingIdx = State.customFonts.findIndex(f => f.name.toLowerCase() === name.toLowerCase());
                    if (existingIdx !== -1) {
                        State.customFonts[existingIdx] = { name, dataUri };
                    } else {
                        State.customFonts.push({ name, dataUri });
                    }

                    try {
                        localStorage.setItem('studiopro_custom_fonts', JSON.stringify(State.customFonts));
                    } catch (storageErr) {
                        console.error("LocalStorage save failed:", storageErr);
                        alert("Could not persist font to browser storage (LocalStorage limit exceeded). It will be available for this session only.");
                    }

                    registerCustomFont(name, dataUri);
                    updatePropertiesPanel();
                } catch (err) {
                    console.error("Error reading font file:", err);

        function deleteSelectedClip() {
            const idsToDeleteRaw = State.multiSelectedClipIds && State.multiSelectedClipIds.length > 0 ? [...State.multiSelectedClipIds] : (State.selectedClipId ? [State.selectedClipId] : []);
            const idsToDelete = idsToDeleteRaw.filter(id => {
                const c = State.clips.find(x => x.id === id);
                if (!c) return false;
                const t = State.tracks.find(tr => tr.id === c.trackId);
                return t && !t.locked;
            });
            if (idsToDelete.length === 0) return;
            
            idsToDelete.forEach(id => {
                window.unlinkClip(id);
                const clipToDelete = State.clips.find(c => c.id === id);
                if (clipToDelete && clipToDelete.audioEl) {
                    if (clipToDelete.playPromise) { clipToDelete.playPromise.then(() => clipToDelete.audioEl.pause()).catch(()=>{}); }
                    else { clipToDelete.audioEl.pause(); }
                    clipToDelete.audioEl.removeAttribute('src');
                    if(clipToDelete.audioNodes) clipToDelete.audioNodes.source.disconnect();
                }
            });
            
            State.clips = State.clips.filter(c => !idsToDelete.includes(c.id));
            State.selectedClipId = null;
            State.multiSelectedClipIds = [];
            calcOverlaps();
            renderClips();
            updatePropertiesPanel();
            drawCanvas();

        function duplicateClip(originalClip) {
            const newId = 'c_' + Date.now() + Math.random().toString(36).substr(2, 5);
            const copy = {
                ...originalClip,
                id: newId,
                effects: JSON.parse(JSON.stringify(originalClip.effects || {}))

            delete copy.linkedClipIds;
            if (copy.title) {
                if (copy.title.toLowerCase().startsWith('new ')) {
                    copy.title = 'Copy ' + copy.title.substring(4);
                } else {
                    if (!copy.title.endsWith(' Copy')) {
                        copy.title = copy.title + ' Copy';
                    }
                }
            }
            copy.isPlaying = false;
            copy.sourceNode = null;

            if (originalClip.videoEl) {

                newVideoEl.src = originalClip.fileUrl;
                newVideoEl.crossOrigin = "anonymous";
                newVideoEl.muted = true;

            if (originalClip.audioEl) {

                newAudioEl.crossOrigin = "anonymous";
                copy.audioEl = newAudioEl;

            return copy;

        function duplicateSelectedClip() {
            const idsToDuplicate = State.multiSelectedClipIds && State.multiSelectedClipIds.length > 0 ? [...State.multiSelectedClipIds] : (State.selectedClipId ? [State.selectedClipId] : []);

        function analyzeBeats(audioBuffer) {
            const channelData = audioBuffer.getChannelData(0);
            const sampleRate = audioBuffer.sampleRate;
            
            // Hop size (frame offset) and window size for envelope calculation
            const hopSize = 1024;
            const windowSize = 2048;
            
            // 1. Calculate energy envelope per frame
            const energy = [];
            for (let i = 0; i + windowSize <= channelData.length; i += hopSize) {
                let sum = 0;
                for (let j = 0; j < windowSize; j++) {
                    const val = channelData[i + j];
                    sum += val * val;
                }
                energy.push(Math.sqrt(sum / windowSize));
            }
            
            if (energy.length === 0) return { bpm: 120, beatTimes: [] };
            
            // 2. Calculate onset strength / energy flux F(n) = max(0, E(n) - E(n-1))
            const flux = [0];
            let maxFlux = 0;
            for (let n = 1; n < energy.length; n++) {
                const diff = Math.max(0, energy[n] - energy[n - 1]);
                flux.push(diff);
                if (diff > maxFlux) maxFlux = diff;
            }
            
            // 3. Peak picking with moving average adaptive threshold
            const beats = [];
            const thresholdWindow = 15; // Local window of ~15 frames (~350ms window at 44.1kHz)
            const multiplier = 1.35; // Adaptive threshold sensitivity coefficient
            const noiseFloor = Math.max(0.0002, maxFlux * 0.015); // dynamic noise floor (1.5% of max flux)
            
            for (let n = 1; n < flux.length - 1; n++) {
                // Compute local mean of flux in surrounding window
                const start = Math.max(0, n - thresholdWindow);
                const end = Math.min(flux.length, n + thresholdWindow + 1);
                let sum = 0;
                for (let j = start; j < end; j++) {
                    sum += flux[j];
                }
                const localMean = sum / (end - start);
                
                // Peak detection conditions
                const isLocalPeak = flux[n] > flux[n - 1] && flux[n] > flux[n + 1];
                const aboveThreshold = flux[n] > (localMean * multiplier) && flux[n] > noiseFloor;
                
                if (isLocalPeak && aboveThreshold) {
                    const beatTime = (n * hopSize) / sampleRate;
                    if (beats.length === 0 || (beatTime - beats[beats.length - 1]) > 0.25) {
                        beats.push(beatTime);
                    }
                }
            }
            
            // 4. Estimate BPM using interval histogram
            let bpm = 120;
            if (beats.length > 1) {
                const intervals = [];
                for (let i = 1; i < beats.length; i++) {
                    intervals.push(beats[i] - beats[i - 1]);
                }
                
                const bins = {};
                intervals.forEach(interval => {
                    // Group intervals into bins of 50ms resolution
                    const rounded = Math.round(interval * 20) / 20; 
                    if (rounded >= 0.25 && rounded <= 2.0) {
                        bins[rounded] = (bins[rounded] || 0) + 1;
                    }
                });
                
                let bestBin = null;
                let maxCount = 0;
                for (const bin in bins) {
                    if (bins[bin] > maxCount) {
                        maxCount = bins[bin];
                        bestBin = parseFloat(bin);
                    }
                }
                
                if (bestBin > 0) {
                    bpm = Math.round(60 / bestBin);
                    while (bpm < 60) bpm *= 2;
                    while (bpm > 180) bpm /= 2;
                    bpm = Math.round(bpm);
                }
            }
            
            return { bpm, beatTimes: beats };
        }

        async function runBeatAnalysis(clipId) {
            const clip = State.clips.find(c => c.id === clipId);
            if (!clip) return;
            
            const loader = document.getElementById('beatLoader');
            if (loader) loader.classList.remove('hidden');
            
            // Try to load/decode on the fly if buffer is missing
            if (!clip.buffer && clip.fileUrl) {
                try {
                    ensureAudioContext();
                    const response = await fetch(clip.fileUrl);
                    const arrayBuffer = await response.arrayBuffer();
                    const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                    clip.buffer = audioBuffer;
                } catch (err) {
                    console.warn("Failed to decode on-the-fly, falling back to tempo generation:", err);
                }
            }
            
            setTimeout(() => {
                try {
                    let result;
                    if (clip.buffer) {
                        result = analyzeBeats(clip.buffer);
                    } else {
                        // Fallback beat grid generator (120 BPM)
                        const fallbackBpm = 120;
                        const interval = 60 / fallbackBpm;
                        const beatTimes = [];
                        for (let t = 0; t < clip.duration; t += interval) {
                            beatTimes.push(t);
                        }
                        result = { bpm: fallbackBpm, beatTimes };
                    }
                    
                    clip.bpm = result.bpm;
                    clip.beatTimes = result.beatTimes.map(localTime => clip.start + localTime);
                    
                    const optMarkers = document.getElementById('beatOptMarkers')?.checked;
                    const optSnap = document.getElementById('beatOptSnap')?.checked;
                    
                    if (optMarkers) {
                        clip.showBeatMarkers = true;
                    }
                    if (optSnap) {
                        State.snapToBeats = true;
                    }
                    
                    const modal = document.getElementById('beatDetectionModal');
                    if (modal) {
                        updateBeatDetectionModalContent(modal, clip);
                        lucide.createIcons();
                    }
                    
                    calcOverlaps();
                    renderClips();
                    drawCanvas();
                } catch (err) {
                    console.error(err);
                    alert('Error performing beat detection: ' + err.message);
                } finally {
                    if (loader) loader.classList.add('hidden');
                }
            }, 100);
        }

        function applyBeatMarkers(clipId) {
            const clip = State.clips.find(c => c.id === clipId);
            if (!clip || !clip.beatTimes) return;
            
            clip.showBeatMarkers = true;

        }

        function clearBeatAnalysis(clipId) {
            const clip = State.clips.find(c => c.id === clipId);
            if (!clip) return;
            
            delete clip.bpm;
            delete clip.beatTimes;
            clip.showBeatMarkers = false;

            renderClips();
        }

        function sliceAudioAtBeats(clipId) {
            const clip = State.clips.find(c => c.id === clipId);
            if (!clip || !clip.beatTimes || clip.beatTimes.length === 0) return;
            
            if (!confirm(`This will split the audio clip into ${clip.beatTimes.length + 1} separate clips at every beat location. Proceed?`)) return;
            
            const sliceTimes = [...clip.beatTimes].sort((a, b) => a - b);
            
            let currentClip = clip;
            for (const time of sliceTimes) {
                if (time > currentClip.start + 0.05 && time < currentClip.start + currentClip.duration - 0.05) {
                    const nextClip = duplicateClip(currentClip);
                    const splitPoint = time;
                    
                    const leftDuration = splitPoint - currentClip.start;
                    const rightDuration = (currentClip.start + currentClip.duration) - splitPoint;
                    
                    currentClip.duration = leftDuration;
                    
                    nextClip.start = splitPoint;
                    nextClip.duration = rightDuration;
                    nextClip.sourceOffset = currentClip.sourceOffset + leftDuration;
                    
                    State.clips.push(nextClip);
                    currentClip = nextClip;
                }
            }
            
            calcOverlaps();
            renderClips();
            updatePropertiesPanel();
            drawCanvas();
            closeBeatDetectionModal();
        }

        function splitClipAtPlayhead() {
            const time = State.currentTime;
            let targetClip = null;
            
            if (State.selectedClipId) {
                const c = State.clips.find(c => c.id === State.selectedClipId);
                const t = c ? State.tracks.find(tr => tr.id === c.trackId) : null;
                if (c && (!t || !t.locked) && time > c.start + 0.05 && time < c.start + c.duration - 0.05) {
                    targetClip = c;
                }
            }
            
            if (!targetClip) {
                const clipsUnderPlayhead = State.clips.filter(c => {
                    const t = State.tracks.find(tr => tr.id === c.trackId);
                    return (!t || !t.locked) && time > c.start + 0.05 && time < c.start + c.duration - 0.05;
                });
                if (clipsUnderPlayhead.length > 0) {
                    targetClip = clipsUnderPlayhead[clipsUnderPlayhead.length - 1]; 
                }
            }
            
            if (!targetClip) return;
            
            const leftDuration = time - targetClip.start;
            const rightDuration = targetClip.duration - leftDuration;
            
            const newAudioEl = targetClip.audioEl ? new Audio(targetClip.fileUrl) : null;
            if (newAudioEl) newAudioEl.crossOrigin = "anonymous";
            
            const newVideoEl = targetClip.videoEl ? document.createElement('video') : null;
            if (newVideoEl) {
                newVideoEl.src = targetClip.fileUrl;
                newVideoEl.crossOrigin = "anonymous";
                newVideoEl.muted = true;
                newVideoEl.load();
            }

            const newClip = {
                ...targetClip,
                id: 'c_' + Date.now() + Math.random().toString(36).substr(2, 5),
                start: time,
                sourceOffset: targetClip.sourceOffset + leftDuration,
                duration: rightDuration,
                audioEl: newAudioEl,
                videoEl: newVideoEl,
                effects: JSON.parse(JSON.stringify(targetClip.effects)), 
                audioNodes: null 
            };
            
            if (newClip.audioEl) buildAudioGraph(newClip);

            targetClip.duration = leftDuration;
            State.clips.push(newClip);
            State.selectedClipId = newClip.id; 
            
            calcOverlaps();
            renderClips();
            updatePropertiesPanel();
            drawCanvas();
        }

        function createSplitClipData(originalClip, startTimeline, startSource, duration) {
            const newAudioEl = originalClip.audioEl ? new Audio(originalClip.fileUrl) : null;
            if (newAudioEl) newAudioEl.crossOrigin = "anonymous";
            const newVideoEl = originalClip.videoEl ? document.createElement('video') : null;
            if (newVideoEl) {
                newVideoEl.src = originalClip.fileUrl;
                newVideoEl.crossOrigin = "anonymous";
                newVideoEl.muted = true;
                newVideoEl.load();
            }
            const newClip = {
                ...originalClip,
                id: 'c_' + Date.now() + Math.random().toString(36).substr(2, 5),
                start: startTimeline,
                sourceOffset: startSource,
                duration: duration,
                audioEl: newAudioEl,
                videoEl: newVideoEl,
                effects: JSON.parse(JSON.stringify(originalClip.effects || [])),
                audioNodes: null
            };
            if (newClip.audioEl) buildAudioGraph(newClip);
            return newClip;
        }

        async function removeSilenceFromSelectedClip() {
            if (!State.selectedClipId) return;
            const clipIndex = State.clips.findIndex(c => c.id === State.selectedClipId);
            if (clipIndex === -1) return;
            const clip = State.clips[clipIndex];
            
            if (clip.type !== 'audio' && clip.type !== 'video') {
                if(typeof showToast === 'function') showToast("Only Audio/Video clips are supported.");
                return;
            }

            // Ensure we have decoded buffer
            if (!clip.buffer) {
                 try {
                     if(typeof showToast === 'function') showToast("Analyzing audio buffer...");
                     ensureAudioContext();
                     const response = await fetch(clip.fileUrl);
                     const arrayBuffer = await response.arrayBuffer();
                     clip.buffer = await audioCtx.decodeAudioData(arrayBuffer);
                 } catch(e) {
                     console.error("Could not decode audio buffer", e);
                     if(typeof showToast === 'function') showToast("Error decoding audio.");
                     return;
                 }
            }
            
            const thresholdDb = -40; // DB threshold for silence
            const thresholdAmp = Math.pow(10, thresholdDb / 20); 
            const minSilenceDuration = 0.3; // seconds
            const padding = 0.05; // 50ms padding
            
            const sampleRate = clip.buffer.sampleRate;
            const data = clip.buffer.getChannelData(0);
            
            const minSilenceSamples = minSilenceDuration * sampleRate;
            
            let isSilent = false;
            let silenceStartSample = 0;
            const silentRegions = [];
            
            const startSample = Math.floor(clip.sourceOffset * sampleRate);
            const endSample = Math.floor((clip.sourceOffset + clip.duration) * sampleRate);
            const blockSize = Math.floor(sampleRate * 0.01);
            
            for (let i = startSample; i < endSample; i += blockSize) {
                let maxAmp = 0;
                for (let j = 0; j < blockSize && i + j < endSample; j++) {
                    const amp = Math.abs(data[i+j]);
                    if (amp > maxAmp) maxAmp = amp;
                }
                
                if (maxAmp < thresholdAmp) {
                    if (!isSilent) {
                        isSilent = true;
                        silenceStartSample = i;
                    }
                } else {
                    if (isSilent) {
                        isSilent = false;
                        const durationSamples = i - silenceStartSample;
                        if (durationSamples >= minSilenceSamples) {
                            silentRegions.push({
                                startSec: silenceStartSample / sampleRate,
                                endSec: i / sampleRate
                            });
                        }
                    }
                }
            }
            if (isSilent) {
                const durationSamples = endSample - silenceStartSample;
                if (durationSamples >= minSilenceSamples) {
                    silentRegions.push({
                        startSec: silenceStartSample / sampleRate,
                        endSec: endSample / sampleRate
                    });
                }
            }
            
            if (silentRegions.length === 0) {
                if(typeof showToast === 'function') showToast("No silence found.");
                return;
            }
            
            let currentSrcTime = clip.sourceOffset;
            let currentTimelineTime = clip.start;
            const newClips = [];
            
            silentRegions.forEach(silence => {
                const validStartSec = currentSrcTime;
                const validEndSec = silence.startSec - padding;
                
                if (validEndSec > validStartSec) {
                    const duration = validEndSec - validStartSec;
                    const newClip = createSplitClipData(clip, currentTimelineTime, validStartSec, duration);
                    newClips.push(newClip);
                    currentTimelineTime += duration;
                }
                currentSrcTime = silence.endSec + padding;
            });
            
            const finalValidStart = currentSrcTime;
            const finalValidEnd = clip.sourceOffset + clip.duration;
            if (finalValidEnd > finalValidStart) {
                const duration = finalValidEnd - finalValidStart;
                const newClip = createSplitClipData(clip, currentTimelineTime, finalValidStart, duration);
                newClips.push(newClip);
            }
            
            if (newClips.length === 0) return; // Entire clip was silence
            
            State.clips.splice(clipIndex, 1, ...newClips);
            State.selectedClipId = newClips[0].id;
            
            calcOverlaps();
            renderClips();
            updatePropertiesPanel();
            drawCanvas();
            if(typeof showToast === 'function') showToast(`Removed ${silentRegions.length} silent gaps.`);
        }

        function seekTimelinePlayhead(delta) {
            State.currentTime = Math.max(0, Math.min(State.currentTime + delta, State.duration));
            updatePlayhead();
            syncMediaElements();
            drawCanvas();
        }

        let keyboardNudgeTooltipTimeout = null;

        function nudgeSelectedClips(delta) {
            const idsToNudge = State.multiSelectedClipIds && State.multiSelectedClipIds.length > 0 ? [...State.multiSelectedClipIds] : (State.selectedClipId ? [State.selectedClipId] : []);
            
            let movedAny = false;
            let primaryClip = null;
            idsToNudge.forEach(id => {
                const clip = State.clips.find(c => c.id === id);
                if (clip) {
                    const track = State.tracks.find(t => t.id === clip.trackId);
                    if (track && track.locked) return; // Skip locked tracks
                    
                    clip.start = Math.max(0, clip.start + delta);
                    movedAny = true;
                    if (id === State.selectedClipId) {
                        primaryClip = clip;
                    }
                }
            });
            
            if (movedAny) {
                // Adjust timeline duration if clips moved beyond current duration
                let maxEnd = 0;
                State.clips.forEach(c => {
                    if (c.start + c.duration > maxEnd) {
                        maxEnd = c.start + c.duration;
                    }
                });
                if (maxEnd > State.duration) {
                    State.duration = Math.ceil(maxEnd + 10);
                    updateTimelineWidth();
                }
                
                calcOverlaps();
                renderClips();
                syncMediaElements();
                drawCanvas();
                updatePropertiesPanel();

                // Dynamic tooltip feedback for keyboard nudging
                const tooltipClip = primaryClip || (idsToNudge.length > 0 ? State.clips.find(c => c.id === idsToNudge[0]) : null);
                if (tooltipClip) {
                    const clipEl = document.querySelector(`.clip[data-clip-id="${tooltipClip.id}"]`);
                    const dragTooltip = document.getElementById('dragTooltip');
                    if (clipEl && dragTooltip) {
                        const rect = clipEl.getBoundingClientRect();
                        dragTooltip.innerHTML = `Start: ${formatTime(tooltipClip.start)}`;
                        
                        // Center tooltip horizontally above the clip
                        dragTooltip.style.left = `${rect.left + rect.width / 2}px`;
                        dragTooltip.style.top = `${rect.top - 28}px`;
                        dragTooltip.classList.remove('hidden');
                        
                        if (keyboardNudgeTooltipTimeout) {
                            clearTimeout(keyboardNudgeTooltipTimeout);
                        }
                        keyboardNudgeTooltipTimeout = setTimeout(() => {
                            dragTooltip.classList.add('hidden');
                            keyboardNudgeTooltipTimeout = null;
                        }, 1000);
                    }
                }
            }
        }

        function calcOverlaps() {
            State.clips.forEach(c => c.overlapping = false);
            for(let i=0; i<State.clips.length; i++) {
                for(let j=i+1; j<State.clips.length; j++) {
                    const c1 = State.clips[i];
                    const c2 = State.clips[j];
                    if(c1.trackId === c2.trackId) {
                        if(c1.start < c2.start + c2.duration - 0.01 && c1.start + c1.duration > c2.start + 0.01) {
                            c1.overlapping = true;
                            c2.overlapping = true;
                        }
                    }
                }
            }
        }

        // --- Rendering Logic ---

        function updateTimelineWidth() {
            const totalWidth = State.duration * State.pixelsPerSecond;
            const finalWidth = Math.max(totalWidth, timelineScrollArea.clientWidth);
            tracksContentContainer.style.width = `${finalWidth}px`;
            rulerWrapper.style.width = `${finalWidth}px`;
            drawRuler(); 
        }

        window.reorderTrack = (draggedId, targetId) => {
            const dragIdx = State.tracks.findIndex(t => t.id === draggedId);
            const targetIdx = State.tracks.findIndex(t => t.id === targetId);
            if (dragIdx === -1 || targetIdx === -1) return;
            
            const dragTrack = State.tracks[dragIdx];
            const targetTrack = State.tracks[targetIdx];
            
            if (dragTrack.type === 'video' && targetTrack.type !== 'video') return;
            if (dragTrack.type === 'audio' && targetTrack.type !== 'audio') return;
            
            State.tracks.splice(dragIdx, 1);
            State.tracks.splice(targetIdx, 0, dragTrack);
            
            renderTrackHeaders();
            renderTracks();
            renderClips();
            drawCanvas();
        };

        function triggerTrackBeatDetection(trackId) {
            const audioClip = State.clips.find(c => c.trackId === trackId && c.type === 'audio');
            if (audioClip) {
                openBeatDetection(audioClip.id);
            } else {
                alert("No audio clip found on this track to analyze. Import or place an audio clip here first.");
            }
        }

                lane.appendChild(el);

                if (clip.type === 'audio' && clip.showBeatMarkers && clip.beatTimes) {
                    clip.beatTimes.forEach(t => {
                        const localTime = t - clip.start;
                        if (localTime >= 0 && localTime <= clip.duration) {
                            const markerEl = document.createElement('div');
                            markerEl.className = 'beat-marker absolute top-0 bottom-0 pointer-events-none z-20 border-l border-dashed border-brand-500/60 w-0';
                            markerEl.style.left = `${localTime * State.pixelsPerSecond}px`;

                if(hasWaveform) {
                    const cvs = el.querySelector('.waveform-canvas');
                    drawCachedWaveform(cvs, clip, palette);
                }
            });
            lucide.createIcons();
            drawAllWaveforms();
        }

        function generatePseudoPeaks(duration, peaksPerSecond) {
            const peaks = [];
            const count = Math.ceil(duration * peaksPerSecond);
            
            // Seeded LCG random generator for absolute determinism
            let r = 42;
            function nextRand() {
                r = (r * 1664525 + 1013904223) % 4294967296;
                return r / 4294967296;
            }

            let amplitude = 0.4;
            let targetAmp = 0.4;
            let steps = 0;

            for (let i = 0; i < count; i++) {
                if (steps <= 0) {
                    targetAmp = 0.05 + nextRand() * 0.75;
                    steps = Math.floor(10 + nextRand() * 40);
                }
                amplitude += (targetAmp - amplitude) * 0.15;
                steps--;

                const noise = (nextRand() - 0.5) * 0.15;
                let val = amplitude + noise;
                val = Math.max(0.01, Math.min(0.9, val));

                // Add periodic speech-like pauses
                const second = i / peaksPerSecond;
                const cycle = second % 8;
                if (cycle > 6.8 && cycle < 7.5) {
                    val *= 0.15;
                }

                peaks.push({ max: val, min: -val });
            }
            return peaks;
        }

        function drawCachedWaveform(canvas, clip, palette) {
            if (!clip.peaks || clip.peaks.length === 0) return;

            const scrollLeft = Math.floor(timelineScrollArea.scrollLeft);
            const viewportWidth = Math.ceil(timelineScrollArea.clientWidth);
            const scrollRight = scrollLeft + viewportWidth;

            // Calculate clip bounds relative to timeline scroll area (aligned to integer pixels to avoid render jitter)
            const clipStartPx = Math.floor(clip.start * State.pixelsPerSecond);
