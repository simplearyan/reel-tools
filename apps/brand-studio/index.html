/* ---------- color, text, font ---------- */
const cv=document.createElement('canvas').getContext('2d');

const mix=(a,b,t)=>'#'+hex(a).map((v,i)=>Math.round(v+(hex(b)[i]-v)*t).toString(16).padStart(2,'0')).join('');

function col(){const P=PAL[S.pal],d=S.theme==='dark',p=S.cp||P[d?2:1],a=S.ca||P[3],bg=S.cbg||(d?mix(p,'#000000',.9):mix(p,'#ffffff',.95)),fg=S.ct||(d?'#f2f2ff':'#16162b');

/* ---------- mark ---------- */

  const shape=sh==='rounded'?`<rect x="${b/2}" y="${b/2}" width="${512-b}" height="${512-b}" rx="${R}" fill="${fill}"${st}/>`:sh==='circle'?`<circle cx="256" cy="256" r="${256-b/2}" fill="${fill}"${st}/>`:sh==='hex'?`<polygon points="256,8 471,132 471,380 256,504 41,380 41,132" fill="${fill}" stroke-linejoin="round"${st}/>`:'';

/* ---------- export ---------- */
const save=(b,n)=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)};
async function dl(px){await loadFont();const fmt=S.fmt,tr=S.tr&&fmt!=='jpg'&&!isImg(),{svg,w,h}=build(!tr),base=`${(S.name.trim()||'brand').toLowerCase().replace(/[^a-z0-9]+/g,'-')}-${S.tab}`;
  if(fmt==='svg')return save(new Blob([svg],{type:'image/svg+xml'}),base+'.svg');
  const pw=px||target(w,h)[0],ph=Math.round(h*pw/w),img=new Image();img.src=uri(svg);await img.decode();
  const cn=document.createElement('canvas');cn.width=pw;cn.height=ph;const x=cn.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(img,0,0,pw,ph);
  await new Promise(r=>cn.toBlob(b=>{save(b,`${base}-${pw}x${ph}.${fmt}`);r()},{png:'image/png',webp:'image/webp',jpg:'image/jpeg'}[fmt],.92))}
$('#dl').onclick=()=>dl();
$('#dl-all').onclick=async()=>{for(const s of[16,32,48,180,192,512]){await dl(s);await new Promise(r=>setTimeout(r,350))}};
$('#imgc').onclick=()=>{S.img='';$('#imgf').value='';render()};
$('#imgf').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const k=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  S.img=f.type==='image/png'||f.type==='image/webp'?c.toDataURL('image/png'):c.toDataURL('image/jpeg',.88);URL.revokeObjectURL(im.src);render()};im.src=URL.createObjectURL(f)};
render();
</script>
</body>
</html>
